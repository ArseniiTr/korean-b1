<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Корейский до B1</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700&display=swap">
<style>
/* Layout: one column (max 760px), sticky header with tabs, cards only for exercises and the active lesson */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#e9edf4; --fg:#151b2b; --muted:#5d6678; --line:#d9dfe9;
  --accent:#1d4ed8; --accent-soft:#e2e9ff; --accent-fg:#ffffff;
  --ok:#157a4f; --ok-soft:#dcf3e7; --bad:#bf3f34; --bad-soft:#fbe4e1; --warn:#a46a12; --warn-soft:#fbefd4;
  --ko:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ko-display:'Nanum Myeongjo','Apple Myungjo','Noto Serif KR',serif;
  --body:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1320; --surface:#161c2c; --surface-2:#1e2639; --fg:#e7ebf3; --muted:#98a2b8; --line:#2a334a;
    --accent:#7d9cff; --accent-soft:#1c2a52; --accent-fg:#0b1020;
    --ok:#4fcf92; --ok-soft:#143526; --bad:#f29084; --bad-soft:#44201c; --warn:#e3ad4e; --warn-soft:#3e2f12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161c2c; --surface-2:#1e2639; --fg:#e7ebf3; --muted:#98a2b8; --line:#2a334a;
  --accent:#7d9cff; --accent-soft:#1c2a52; --accent-fg:#0b1020;
  --ok:#4fcf92; --ok-soft:#143526; --bad:#f29084; --bad-soft:#44201c; --warn:#e3ad4e; --warn-soft:#3e2f12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;margin:0;min-height:100%}
.ko{font-family:var(--ko)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
button{font:inherit;cursor:pointer}
input{font:inherit}
a{color:var(--accent)}
.hidden{display:none!important}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--ko-display);font-size:22px;letter-spacing:.01em}
.brand h1 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)} .sync.local i{background:var(--warn)}
nav.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}

main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
section.view{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 16px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:13px}

/* topic list */
.level{border-top:1px solid var(--line);padding-top:14px}
.level-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.level-head h2{font-size:17px}
.topic{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line);text-align:left;background:none;border-top:0;border-left:0;border-right:0;width:100%;color:inherit}
.topic:hover{background:var(--surface-2)}
.topic .t{font-family:var(--ko);font-weight:500;font-size:16px}
.topic .n{font-size:13px;color:var(--muted);grid-column:1}
.topic .bar{width:72px;grid-column:2;grid-row:2}
.topic .chip{grid-column:2;grid-row:1;justify-self:end}

/* lesson */
.lesson h2{font-family:var(--ko);font-size:26px;font-weight:700}
.lesson .sub{color:var(--muted);margin-top:2px}
.lesson p{max-width:65ch}
.formula{font-family:var(--ko);background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-weight:500}
.examples{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.examples li{display:grid;gap:2px}
.examples .k{font-family:var(--ko);font-size:18px;font-weight:500}
.examples .r{color:var(--muted);font-size:14px}
.ai-box{background:var(--surface-2);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:15px;max-width:65ch}
.ai-box:empty{display:none}

/* exercise */
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.ex-q{font-size:20px;font-weight:500;margin-top:14px;line-height:1.45}
.ex-q .ko{font-size:22px}
.options{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--ko);font-size:17px;color:inherit}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.answer input{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font-family:var(--ko);font-size:17px}
.answer input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.bad{background:var(--bad-soft);color:var(--bad)} .fb.neutral{background:var(--surface-2);color:var(--fg)}
.fb .ko{font-size:17px;font-weight:500;color:var(--fg)}
.fb .why{display:block;margin-top:6px;color:var(--fg);opacity:.85}
.progress-dots{display:flex;gap:5px}
.progress-dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);display:inline-block}
.progress-dots i.ok{background:var(--ok)} .progress-dots i.bad{background:var(--bad)} .progress-dots i.cur{background:var(--accent)}
.loader{display:flex;align-items:center;gap:10px;color:var(--muted)}
.loader i{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loader i{animation:none}.bar i{transition:none}}

/* flashcards */
.flash{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;user-select:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;width:100%;color:inherit}
.flash .w{font-family:var(--ko-display);font-size:40px;font-weight:700}
.flash .m{font-size:20px}
.flash .hint{font-size:13px;color:var(--muted)}
.vocab-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px;font-size:15px}
.vocab-list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.vocab-list .ko{font-weight:500}
.box-dots{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.box-dots i{width:5px;height:5px;border-radius:50%;background:var(--line);display:inline-block}
.box-dots i.on{background:var(--ok)}

.errors li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.errors .ko{font-size:16px}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
ul.plain{margin:0;padding-left:18px}
@media (max-width:480px){.lesson h2{font-size:22px}.ex-q{font-size:18px}.flash .w{font-size:32px}}
html,body{height:100%}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;display:grid;gap:14px}
.gate-card h1{font-family:var(--ko-display);font-size:28px}
.gate-card form{display:flex;gap:8px;flex-wrap:wrap}
.gate-card input{flex:1;min-width:160px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font-size:17px}
.gate-card input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
</style>
</head>
<body>
<div id="gate" class="gate hidden"></div>

<header class="top hidden"><div class="top-inner">
  <div class="brand">
    <h1 class="ko">한국어 → B1 <small>Личный учебник</small></h1>
    <div class="sync" id="sync"><i></i><span>Загрузка…</span></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="home" aria-selected="true">Главная</button>
    <button role="tab" data-tab="topics">Темы</button>
    <button role="tab" data-tab="train">Тренировка</button>
    <button role="tab" data-tab="vocab">Слова</button>
  </nav>
</div></header>

<main class="hidden">
  <section class="view" id="view-home"></section>
  <section class="view hidden" id="view-topics"></section>
  <section class="view hidden" id="view-lesson"></section>
  <section class="view hidden" id="view-train"></section>
  <section class="view hidden" id="view-vocab"></section>
</main>

<script>
/* ============ ПРОГРАММА ============ */
const LEVELS=[
 {id:'A1',name:'A1 · Основы',desc:'Пройдено на занятиях по конспекту. Темы помечены знакомыми, но будут всплывать на повторение.'},
 {id:'A1+',name:'A1+ · Завершаем начальный уровень',desc:'Integrated Korean Beginning 1, уроки 3–8 · Benedittis, разделы 9–14.'},
 {id:'A2',name:'A2 · Связки, причины, модальность',desc:'Integrated Korean Beginning 2, уроки 9–13.'},
 {id:'A2+',name:'A2+ · Сложные конструкции',desc:'Integrated Korean Beginning 2, уроки 14–17. Рубеж TOPIK II начинается здесь.'},
 {id:'B1',name:'B1 · Оттенки смысла',desc:'Грамматика уровня TOPIK 3: предположение, воспоминание, уступка, сожаление.'},
 {id:'B1+',name:'B1+ · Письменный и продвинутый стиль',desc:'Книжные причины, составные конструкции, сравнения. Финиш B1.'}
];
// id, lv, t (паттерн), n (название по-русски), src (источник), k (знакомо по конспекту), ex (объяснение), f (формула), e (примеры)
const T=[
{id:'hangul',lv:'A1',k:1,t:'한글과 받침',n:'Хангыль и чтение патчима',src:'IK1 вводный урок · Benedittis 1–3',
 ex:'Слог = согласная + гласная (+ патчим, конечная согласная). В конце слога все согласные сводятся к семи звукам: ㄱ(ㅋ,ㄲ)→[k], ㄴ→[n], ㄷ(ㅅ,ㅆ,ㅈ,ㅊ,ㅌ,ㅎ)→[t], ㄹ→[l], ㅁ→[m], ㅂ(ㅍ)→[p], ㅇ→[ng]. Если следующий слог начинается с ㅇ, патчим перетекает в него: 음악→[으막], 읽어요→[일거요]. Перед ㄴ и ㅁ звуки ㅂ/ㄷ/ㄱ становятся носовыми: 감사합니다→[감사함니다].',
 f:'받침 + ㅇ → перенос звука · ㅂ+ㄴ → [ㅁㄴ] · ㄱ+ㄴ → [ㅇㄴ]',
 e:[['옷이 [오시]','одежда (подлежащее)'],['물을 [무를]','воду'],['같이 [가치]','вместе'],['한국말 [한궁말]','корейский язык']]},
{id:'ieyo',lv:'A1',k:1,t:'N이에요 / 예요',n:'Связка «это N»',src:'IK1 урок 1 · Benedittis 4',
 ex:'Связка «быть кем-то или чем-то». После существительного с патчимом ставим 이에요, без патчима — 예요. Вопрос звучит так же, только интонация идёт вверх. Это вежливо-неформальный стиль 해요체, на котором говорят с коллегами и знакомыми.',
 f:'N + 받침 → 이에요 · N без 받침 → 예요',
 e:[['저는 아르세니예요.','Я Арсений.'],['성민은 한국 사람이에요.','Сонмин — кореянка.'],['이거 뭐예요?','Что это?']]},
{id:'eun-neun',lv:'A1',k:1,t:'은/는',n:'Частица темы',src:'IK1 урок 1 · Benedittis 4',
 ex:'Выделяет тему — то, о чём идёт речь, — или противопоставляет. Используется, когда представляешься, и когда предмет уже известен (как английское the). После патчима 은, без патчима 는.',
 f:'N + 받침 → 은 · N без 받침 → 는',
 e:[['저는 러시아 사람이에요.','Я русский.'],['한국은 추워요.','В Корее холодно.'],['아르세니는 일해요.','Арсений работает.']]},
{id:'i-ga',lv:'A1',k:1,t:'이/가',n:'Частица подлежащего',src:'IK1 урок 2 · Benedittis 6',
 ex:'Отмечает подлежащее, особенно когда оно упоминается впервые (как английское a) или когда отвечаем на вопрос «кто?». С 있다/없다 почти всегда 이/가. После патчима 이, без него 가. Особые формы: 저→제가, 나→내가, 누구→누가.',
 f:'N + 받침 → 이 · N без 받침 → 가 · 저 → 제가 · 누구 → 누가',
 e:[['누가 영화 봐요? — 아르세니가 봐요.','Кто смотрит фильм? — Арсений.'],['책상이 있어요. 책상은 예뻐요.','Есть стол. Стол красивый.'],['지갑이 어디에 있어요?','Где кошелёк?']]},
{id:'present',lv:'A1',k:1,t:'-아요 / 어요 / 해요',n:'Настоящее время, вежливый стиль',src:'IK1 урок 1 · Benedittis 9–11',
 ex:'Отбрасываем 다. Если последняя гласная основы ㅏ или ㅗ — добавляем 아요 (가다→가요, 보다→봐요, 오다→와요). Иначе — 어요 (먹다→먹어요, 마시다→마셔요, где ㅣ+ㅓ=ㅕ; 쉬다→쉬어요, 기다리다→기다려요). Глаголы на 하다 → 해요.',
 f:'ㅏ/ㅗ + 아요 · остальные гласные + 어요 · 하다 → 해요',
 e:[['저는 커피를 마셔요.','Я пью кофе.'],['뭐 해요?','Что делаешь?'],['성민이는 자요.','Сонмин спит.']]},
{id:'an',lv:'A1',k:1,t:'안 / -지 않다',n:'Отрицание «не»',src:'IK1 урок 1 · Benedittis 13',
 ex:'안 ставится прямо перед глаголом или прилагательным. У глаголов «существительное + 하다» 안 встаёт между частями: 공부 안 해요, а не 안 공부해요. Длинная форма -지 않아요 значит то же самое и звучит чуть формальнее.',
 f:'안 + V/A · N 안 하다 · V-지 않아요',
 e:[['저는 사과를 안 먹어요.','Я не ем яблоки.'],['오늘은 공부 안 해요.','Сегодня не учусь.'],['먹지 않아요.','Не ем.']]},
{id:'e-place',lv:'A1',k:1,t:'에 (куда / где / когда)',n:'Направление, местонахождение, время',src:'IK1 урок 2 · Benedittis 7',
 ex:'에 отвечает на «куда?» с глаголами движения 가다/오다/다니다 и на «где?» с 있다/없다. Также обозначает время: 일곱 시에 (в семь), 월요일에 (в понедельник). Не путать с 에서 — местом, где происходит действие.',
 f:'место + 에 + 가요/와요/있어요 · время + 에',
 e:[['어디에 가요?','Куда идёшь?'],['저는 집에 있어요.','Я дома.'],['일곱 시에 만나요.','Встречаемся в семь.']]},
{id:'itda',lv:'A1',k:1,t:'있다 / 없다',n:'Есть и нет, иметь и не иметь',src:'IK1 урок 2 · Benedittis 7',
 ex:'있어요 — «есть, находится, имею», 없어요 — «нет, отсутствует». Предмет оформляется частицей 이/가. О старших говорят уважительно 계세요. Эти глаголы также входят в 맛있다 (вкусный), 재미있다 (интересный), 맛없다 (невкусный).',
 f:'N이/가 있어요 · N이/가 없어요',
 e:[['여자친구 있어요?','У тебя есть девушка?'],['돈이 없어요.','Денег нет.'],['화장실이 어디에 있어요?','Где туалет?']]},
{id:'location',lv:'A1',k:1,t:'위 / 아래 / 앞 / 뒤 / 옆 / 안 / 밖 + 에',n:'Слова места',src:'IK1 урок 2 · Benedittis 7',
 ex:'Слово места ставится после существительного, затем 에: 책상 위에 (на столе). 위 — на, над; 아래/밑 — под; 앞 — перед; 뒤 — за; 옆 — рядом; 안 — внутри; 밖 — снаружи; 사이 — между.',
 f:'N + слово места + 에 (있어요)',
 e:[['냉장고 안에 우유가 있어요.','В холодильнике есть молоко.'],['집 앞에 나무가 있어요.','Перед домом дерево.'],['제 옆에 성민이가 있어요.','Рядом со мной Сонмин.']]},
{id:'hago',lv:'A1',k:1,t:'하고 / (이)랑 / 같이',n:'«И» и «с кем»',src:'IK1 урок 3 · Benedittis 10',
 ex:'하고 соединяет существительные («и») и обозначает спутника («с кем»). Разговорный вариант — (이)랑: 고기랑 생선. 같이 [가치] — «вместе», часто следует за 하고.',
 f:'N하고 N · N하고 같이 · N(이)랑 N',
 e:[['사과하고 오렌지를 사요.','Покупаю яблоки и апельсины.'],['누구하고 같이 일해요?','С кем работаешь?'],['엄마랑 공원에 갔어요.','Ходил с мамой в парк.']]},
{id:'ui',lv:'A1',k:1,t:'의 / 제',n:'Принадлежность',src:'IK1 урок 2 · Benedittis 5',
 ex:'의 читается [에] и соединяет «чьё» и «что»: 아르세니의 가방 — сумка Арсения. В разговорной речи часто опускается. 저의 стягивается в 제, 나의 — в 내: 제 아내 (моя жена).',
 f:'N의 N · 저의 → 제 · 나의 → 내',
 e:[['누구의 가방이에요?','Чья это сумка?'],['BTS의 노래를 들어요.','Слушаю песни BTS.'],['제 이름은 아르세니예요.','Меня зовут Арсений.']]},
{id:'deul',lv:'A1',k:1,t:'들',n:'Множественное число',src:'Benedittis 5',
 ex:'들 добавляется к одушевлённым и ставится, когда множественность важна: 사람들, 친구들. У неодушевлённых обычно опускается: 사과 세 개 (три яблока), а не 사과들.',
 f:'N + 들',
 e:[['이 사람들 누구예요?','Кто эти люди?'],['친구들하고 영화 봐요.','Смотрю фильм с друзьями.'],['많은 사람들하고 일해요.','Работаю со многими людьми.']]},
{id:'eul-reul',lv:'A1',k:1,t:'을/를',n:'Прямое дополнение',src:'IK1 урок 3 · Benedittis 8',
 ex:'Отмечает объект действия — что едят, читают, покупают. После патчима 을, без него 를. В разговоре часто опускается: 밥 먹어요.',
 f:'N + 받침 → 을 · N без 받침 → 를',
 e:[['저는 책을 읽어요.','Я читаю книгу.'],['커피를 마셔요.','Пью кофе.'],['계란하고 고기를 샀어요.','Купил яйца и мясо.']]},
{id:'anieyo',lv:'A1',k:1,t:'이/가 아니에요',n:'«Это не N»',src:'Benedittis 6 · IK1 урок 1',
 ex:'Отрицание связки 이에요/예요. Существительное оформляется 이/가, затем 아니에요. Ответ «нет» — 아니요.',
 f:'N이/가 아니에요',
 e:[['저는 미국 사람이 아니에요.','Я не американец.'],['이거는 커피가 아니에요.','Это не кофе.'],['아니요, 학생이 아니에요.','Нет, я не студент.']]},
{id:'numbers-sino',lv:'A1',k:1,t:'일, 이, 삼… (한자어 수)',n:'Китайские числительные: деньги, даты, телефон',src:'IK1 урок 4 · Benedittis 8',
 ex:'일 이 삼 사 오 육 칠 팔 구 십, затем 백 (100), 천 (1000), 만 (10 000). Большие числа считаем по 만: 3만 4000원. С ними называют деньги (원), даты (년/월/일), минуты (분), этажи (층), номера телефонов (ноль — 공). Исключения: 6월 → 유월, 10월 → 시월.',
 f:'число + 원 / 년 / 월 / 일 / 분 / 층',
 e:[['오늘은 2026년 5월 15일이에요.','Сегодня 15 мая 2026 года.'],['1킬로에 얼마예요?','Сколько стоит килограмм?'],['십사 층에서 살아요.','Живу на четырнадцатом этаже.']]},
{id:'numbers-native',lv:'A1',k:1,t:'하나, 둘, 셋… + 개 / 명 / 살 / 잔 / 시',n:'Корейские числительные и счётные слова',src:'IK1 урок 4 · Benedittis 8',
 ex:'하나 둘 셋 넷 다섯 여섯 일곱 여덟 아홉 열, 스물. Перед счётным словом 하나→한, 둘→두, 셋→세, 넷→네, 스물→스무. Счётные слова: 개 (штуки), 명 (люди), 살 (возраст), 잔 (чашки), 마리 (животные), 권 (книги), 시 (часы). Минуты — китайскими числительными: 두 시 삼십 분.',
 f:'N + число + счётное слово · 한 개, 두 명, 세 잔, 네 시',
 e:[['커피 한 잔 주세요.','Одну чашку кофе, пожалуйста.'],['동생 한 명 있어요.','У меня один младший брат.'],['지금 열 시 이십 분이에요.','Сейчас десять двадцать.']]},
{id:'past',lv:'A1',k:1,t:'-았어요 / 었어요 / 했어요',n:'Прошедшее время',src:'IK1 урок 7 · Benedittis 14',
 ex:'Берём форму настоящего времени и перед 요 вставляем ㅆ어: 가요→갔어요, 먹어요→먹었어요, 마셔요→마셨어요, 해요→했어요. Для существительных со связкой: 이었어요 / 였어요.',
 f:'ㅏ/ㅗ + 았어요 · остальные + 었어요 · 하다 → 했어요 · N이었어요/였어요',
 e:[['어제 뭐 봤어요?','Что смотрел вчера?'],['한국어 공부를 시작했어요.','Начал учить корейский.'],['아빠가 소주를 마셨어요.','Папа выпил соджу.']]},
{id:'go-sipda',lv:'A1',k:1,t:'-고 싶다',n:'Хочу что-то сделать',src:'IK1 урок 5 · Benedittis 8',
 ex:'К основе глагола (без 다) добавляем 고 싶어요. Используется о себе и в вопросах к собеседнику. О третьем лице говорят -고 싶어 해요. Объект может оформляться и 을/를, и 이/가.',
 f:'V-고 싶어요 · V-고 싶었어요 · (о других) V-고 싶어 해요',
 e:[['자고 싶어요.','Хочу спать.'],['밥 먹고 싶어요.','Хочу поесть.'],['한국에 가고 싶어요.','Хочу поехать в Корею.']]},
{id:'mot',lv:'A1',k:1,t:'못',n:'Не могу (нет возможности)',src:'IK1 урок 7 · Benedittis 13',
 ex:'못 — «не могу, не получается», в отличие от 안 — «не хочу, не делаю». Ставится перед глаголом, у 하다-глаголов — между частями: 운동 못 해요. Длинная форма -지 못해요.',
 f:'못 + V · N 못 하다 · V-지 못해요',
 e:[['저는 사과를 못 먹어요.','Я не могу есть яблоки.'],['오늘 못 가요.','Сегодня не смогу прийти.'],['술을 못 마셔요.','Не могу пить алкоголь.']]},
{id:'hante',lv:'A1',k:1,t:'한테 / 에게 / 한테서',n:'Кому, от кого',src:'IK1 урок 6 · Benedittis 10',
 ex:'한테 (разговорное) и 에게 (письменное) значат «кому»: 엄마한테 전화해요. 한테서 / 에게서 — «от кого». По отношению к старшим используют 께.',
 f:'N한테/에게 + 주다/전화하다/말하다 · N한테서 받다 · N께',
 e:[['엄마한테 전화해요.','Звоню маме.'],['친구한테 선물을 줬어요.','Подарил другу подарок.'],['선생님께 질문했어요.','Задал вопрос учителю.']]},
{id:'eseo-from',lv:'A1',k:1,t:'에서 왔어요',n:'Откуда приехал',src:'IK1 урок 1',
 ex:'에서 с глаголом 오다 означает «из, откуда». Это стандартный ответ на вопрос о происхождении.',
 f:'N (страна, город) + 에서 왔어요',
 e:[['어디에서 왔어요?','Откуда вы?'],['러시아에서 왔어요.','Я из России.'],['모스크바에서 왔어요.','Я из Москвы.']]},
{id:'i-geu-jeo',lv:'A1',k:1,t:'이 / 그 / 저, 이거 / 그거 / 저거',n:'Указательные слова',src:'IK1 урок 2 · Benedittis 5',
 ex:'이 — рядом с говорящим (этот), 그 — рядом с собеседником или уже упомянутое (тот), 저 — далеко от обоих (вон тот). 이거/그거/저거 — «это/то/вон то» как существительные. 여기/거기/저기 — здесь/там/вон там.',
 f:'이/그/저 + N · 이거/그거/저거 · 여기/거기/저기',
 e:[['이 사람은 제 친구예요.','Этот человек — мой друг.'],['그거 뭐예요?','Что это у тебя?'],['저기 화장실이 있어요.','Вон там туалет.']]},

{id:'eseo-place',lv:'A1+',t:'에서 (где происходит действие)',n:'Место действия',src:'IK1 урок 3 · Benedittis 11',
 ex:'에서 — место, где что-то происходит: работа, еда, учёба. Сравните: 집에 있어요 (нахожусь дома — 에 с 있다) и 집에서 쉬어요 (отдыхаю дома — действие).',
 f:'место + 에서 + глагол действия',
 e:[['브쿠스빌에서 일해요.','Работаю во ВкусВилле.'],['식당에서 밥을 먹어요.','Ем в ресторане.'],['어디에서 한국어를 공부해요?','Где учишь корейский?']]},
{id:'do',lv:'A1+',t:'도',n:'Тоже, также',src:'IK1 урок 2 · Benedittis 9',
 ex:'도 заменяет частицы 은/는, 이/가, 을/를: 저도 (я тоже), 커피도 (и кофе тоже). С другими частицами ставится после них: 집에도, 친구한테도. В отрицании значит «даже … не»: 물도 안 마셨어요.',
 f:'N도 (вместо 은/는, 이/가, 을/를) · N에도 · N한테도',
 e:[['저도 러시아 사람이에요.','Я тоже русский.'],['커피도 마셔요.','И кофе тоже пью.'],['한국에도 갔어요.','В Корею тоже ездил.']]},
{id:'formal',lv:'A1+',t:'-습니다 / -ㅂ니다',n:'Официально-вежливый стиль',src:'Benedittis 4 · IK1 урок 6',
 ex:'Стиль новостей, презентаций и обслуживания. После патчима 습니다, без патчима ㅂ니다: 먹습니다, 갑니다. Вопрос: 습니까? / ㅂ니까?. Прошедшее: 갔습니다. Связка: 입니다 / 입니까. Основа на ㄹ теряет ㄹ: 살다→삽니다.',
 f:'받침 + 습니다 · без 받침 + ㅂ니다 · N입니다 · вопрос -습니까?',
 e:[['저는 아르세니입니다.','Я Арсений.'],['한국어를 공부합니다.','Изучаю корейский.'],['어디에 갑니까?','Куда вы идёте?']]},
{id:'seyo',lv:'A1+',t:'-(으)세요 / 주세요',n:'Вежливая просьба и уважение',src:'IK1 урок 3 · Benedittis 12',
 ex:'-(으)세요 делает глагол уважительным (о старшем: 선생님이 가세요) и служит мягкой просьбой («сделайте, пожалуйста»). После патчима 으세요, без него 세요. Особые формы: 먹다/마시다→드세요, 자다→주무세요, 있다→계세요. N 주세요 — «дайте N».',
 f:'받침 + 으세요 · без 받침 + 세요 · N 주세요',
 e:[['여기 앉으세요.','Садитесь здесь.'],['맛있게 드세요.','Приятного аппетита.'],['물 한 잔 주세요.','Дайте, пожалуйста, стакан воды.']]},
{id:'honorific',lv:'A1+',t:'-(으)시-',n:'Уважительный суффикс',src:'IK1 урок 6 · Benedittis 12–14',
 ex:'Когда говорим о старшем или уважаемом человеке, в глагол вставляем 시: 가다→가세요 (настоящее), 가셨어요 (прошедшее). Уважительная лексика: 계시다 (있다), 드시다 (먹다), 주무시다 (자다), 말씀하시다 (말하다). Частицы: 께서 вместо 이/가, 께 вместо 한테. Существительные: 나이→연세, 집→댁, 이름→성함.',
 f:'V-(으)시 + 어요 → -(으)세요 · V-(으)셨어요 · N께서',
 e:[['할머니께서 주무세요.','Бабушка спит.'],['선생님이 어디에 가셨어요?','Куда ушёл учитель?'],['성함이 어떻게 되세요?','Как вас зовут?']]},
{id:'adjectives-b',lv:'A1+',t:'ㅂ-неправильные: 맵다 → 매워요',n:'Прилагательные на ㅂ',src:'IK1 уроки 4–5 · Benedittis 9',
 ex:'Прилагательные описывают состояние и спрягаются как глаголы: 맵다 острый, 춥다 холодный, 덥다 жаркий, 어렵다 трудный, 쉽다 лёгкий, 가깝다 близкий. Перед гласной ㅂ превращается в 우: 맵+어요→매워요, 추워요, 더워요, 어려워요. Исключения: 돕다→도와요, 입다→입어요 и 좁다→좁아요 (правильные).',
 f:'A-ㅂ + 어요 → -워요 · 돕다 → 도와요 · 입다 → 입어요',
 e:[['떡볶이가 매워요.','Ттокпокки острый.'],['한국어가 어려워요?','Корейский трудный?'],['오늘 날씨가 추워요.','Сегодня холодно.']]},
{id:'irregular-eu',lv:'A1+',t:'ㅡ-неправильные: 쓰다 → 써요',n:'Основы на ㅡ',src:'IK1 урок 4 · Benedittis 10',
 ex:'Если основа оканчивается на ㅡ, при добавлении 어요/아요 ㅡ выпадает: 쓰다→써요, 크다→커요, 바쁘다→바빠요 (предыдущая гласная ㅏ, поэтому 아), 예쁘다→예뻐요, 아프다→아파요, 배고프다→배고파요.',
 f:'V/A-ㅡ + 어요/아요 → ㅡ выпадает',
 e:[['요즘 너무 바빠요.','В последнее время очень занят.'],['머리가 아파요.','Болит голова.'],['이메일을 써요.','Пишу письмо.']]},
{id:'irregular-reu',lv:'A1+',t:'르-неправильные: 모르다 → 몰라요',n:'Основы на 르',src:'IK1 урок 5 · Benedittis 10',
 ex:'У основ на 르 перед 아/어 выпадает ㅡ и удваивается ㄹ: 모르다→몰라요 (не знаю), 빠르다→빨라요 (быстрый), 다르다→달라요 (другой), 부르다→불러요 (звать, петь), 기르다→길러요 (растить). Исключения: 따르다→따라요, 들르다→들러요.',
 f:'르 + 아/어요 → ㄹ라요 / ㄹ러요',
 e:[['잘 몰라요.','Не очень знаю.'],['한국 노래를 불러요.','Пою корейскую песню.'],['지하철이 더 빨라요.','Метро быстрее.']]},
{id:'irregular-d',lv:'A1+',t:'ㄷ-неправильные: 듣다 → 들어요',n:'Основы на ㄷ',src:'IK1 урок 3 · Benedittis 9',
 ex:'У части глаголов ㄷ перед гласной становится ㄹ: 듣다→들어요 (слушать), 걷다→걸어요 (идти пешком), 묻다→물어요 (спрашивать). Перед согласной ㄷ остаётся: 듣고, 듣습니다. Правильные: 받다→받아요, 닫다→닫아요, 믿다→믿어요.',
 f:'V-ㄷ + гласная → ㄹ · перед согласной без изменений',
 e:[['음악을 들어요.','Слушаю музыку.'],['공원에서 걸었어요.','Гулял пешком в парке.'],['선생님한테 물어보세요.','Спросите у учителя.']]},
{id:'irregular-l',lv:'A1+',t:'ㄹ-основы: 살다 → 삽니다, 사세요',n:'Выпадение ㄹ',src:'IK1 урок 5 · Benedittis 9',
 ex:'Основа на ㄹ теряет ㄹ перед ㄴ, ㅂ, ㅅ: 살다→삽니다, 사세요, 사는 사람; 만들다→만듭니다, 만드세요; 알다→압니다, 아세요. Перед 어요 всё как обычно: 살아요, 만들어요. После ㄹ не ставится 으: 만들면, а не 만들으면.',
 f:'ㄹ выпадает перед ㄴ / ㅂ / ㅅ · ㄹ + 면 / 세요 без 으',
 e:[['어디에서 사세요?','Где вы живёте?'],['미역국을 만듭니다.','Готовлю суп из морской капусты.'],['그 사람을 아세요?','Вы знаете этого человека?']]},
{id:'future',lv:'A1+',t:'-(으)ㄹ 거예요',n:'Будущее время и намерение',src:'IK1 урок 7 · Benedittis 14',
 ex:'Планы и предположения. После патчима 을 거예요, без патчима ㄹ 거예요, после ㄹ — просто 거예요: 먹을 거예요, 갈 거예요, 살 거예요. О третьем лице это ещё и «наверное»: 비가 올 거예요.',
 f:'받침 + 을 거예요 · без 받침 + ㄹ 거예요 · ㄹ + 거예요',
 e:[['내일 뭐 할 거예요?','Что будешь делать завтра?'],['주말에 친구를 만날 거예요.','На выходных встречусь с другом.'],['내년에 한국에 갈 거예요.','В следующем году поеду в Корею.']]},
{id:'ko',lv:'A1+',t:'-고',n:'Соединение действий: «и, а затем»',src:'IK1 урок 6 · Benedittis 10',
 ex:'Соединяет два предложения в одно: перечисление или последовательность. Время ставится только в последнем глаголе: 밥을 먹고 커피를 마셨어요. Основа + 고 без изменений, в том числе после ㄹ.',
 f:'V/A-고 V/A',
 e:[['저는 밥을 먹고 커피를 마셔요.','Я ем и пью кофе.'],['성민이는 예쁘고 똑똑해요.','Сонмин красивая и умная.'],['숙제를 하고 잤어요.','Сделал домашку и лёг спать.']]},
{id:'jiman',lv:'A1+',t:'-지만',n:'Но, хотя',src:'IK1 урок 7 · Benedittis 13',
 ex:'Противопоставление внутри одного предложения. Основа + 지만. Прошедшее можно ставить и в первой части: 갔지만. Отдельное слово 하지만 — «но» в начале предложения.',
 f:'V/A-지만 · -았/었지만 · N이지만',
 e:[['한국어는 어렵지만 재미있어요.','Корейский трудный, но интересный.'],['비싸지만 샀어요.','Дорого, но купил.'],['먹고 싶지만 시간이 없어요.','Хочу поесть, но нет времени.']]},
{id:'buteo-kkaji',lv:'A1+',t:'부터 ~ 까지 / 에서 ~ 까지',n:'От … до …',src:'Benedittis 8 · IK1 урок 6',
 ex:'Для времени: 부터 (с) … 까지 (до): 9시부터 6시까지. Для места: 에서 (от) … 까지 (до): 집에서 회사까지. 까지 также значит «к сроку» и «даже»: 금요일까지 (к пятнице).',
 f:'время부터 время까지 · место에서 место까지',
 e:[['아홉 시부터 여섯 시까지 일해요.','Работаю с девяти до шести.'],['집에서 학교까지 걸어가요.','От дома до школы иду пешком.'],['월요일부터 금요일까지 수업이 있어요.','Занятия с понедельника по пятницу.']]},
{id:'euro',lv:'A1+',t:'(으)로',n:'Направление, средство, способ',src:'IK1 урок 8 · Benedittis 12',
 ex:'«В сторону, на чём, чем, на каком языке»: 왼쪽으로 (налево), 버스로 (на автобусе), 한국어로 (по-корейски), 젓가락으로 (палочками). После патчима 으로, без патчима и после ㄹ — 로: 지하철로, 연필로.',
 f:'받침 + 으로 · без 받침 / ㄹ + 로',
 e:[['지하철로 가요.','Еду на метро.'],['한국어로 말하세요.','Говорите по-корейски.'],['오른쪽으로 가세요.','Идите направо.']]},
{id:'reo',lv:'A1+',t:'-(으)러 가다 / 오다',n:'Идти, чтобы …',src:'IK1 урок 6 · Benedittis 11',
 ex:'Цель движения, только с глаголами 가다, 오다, 다니다. После патчима 으러, без патчима и после ㄹ — 러: 먹으러 가요, 보러 가요, 놀러 와요.',
 f:'V-(으)러 가요 / 와요 / 다녀요',
 e:[['밥 먹으러 가요.','Иду поесть.'],['친구를 만나러 카페에 갔어요.','Пошёл в кафе встретиться с другом.'],['한국어를 배우러 학원에 다녀요.','Хожу на курсы учить корейский.']]},
{id:'kkayo',lv:'A1+',t:'-(으)ㄹ까요?',n:'Давайте …? Как думаете …?',src:'IK1 урок 8 · Benedittis 13',
 ex:'Два значения: предложение сделать вместе (우리 같이 갈까요? — пойдём?) и вопрос-предположение (비가 올까요? — будет дождь?). Ответ на предложение — -(으)ㅂ시다 (давайте) или просто -아/어요.',
 f:'받침 + 을까요? · без 받침 / ㄹ + ㄹ까요?',
 e:[['우리 같이 영화 볼까요?','Посмотрим вместе фильм?'],['뭐 먹을까요?','Что будем есть?'],['내일 날씨가 좋을까요?','Завтра будет хорошая погода?']]},
{id:'go-itda',lv:'A1+',t:'-고 있다',n:'Сейчас делаю (процесс)',src:'IK1 урок 8',
 ex:'Действие, которое длится прямо сейчас или в описываемый момент. Основа + 고 있어요. Уважительно: -고 계세요. Прошедшее: -고 있었어요. Для одежды и аксессуаров означает состояние: 모자를 쓰고 있어요 — в шапке.',
 f:'V-고 있어요 · V-고 계세요 · V-고 있었어요',
 e:[['지금 뭐 하고 있어요?','Что сейчас делаешь?'],['한국어를 공부하고 있어요.','Учу корейский.'],['아버지는 신문을 읽고 계세요.','Отец читает газету.']]},
{id:'question-words',lv:'A1+',t:'무슨 / 어떤 / 몇 / 얼마나 / 왜 / 어떻게',n:'Вопросительные слова',src:'IK1 уроки 2–5',
 ex:'뭐 (что), 무슨 (какой, какого рода: 무슨 음식), 어떤 (какой по качеству), 몇 (сколько — со счётным словом: 몇 명), 얼마 (сколько стоит), 얼마나 (насколько, как долго), 언제 (когда), 어디 (где), 누구 (кто), 왜 (почему), 어떻게 (как). Вопросительное слово стоит там же, где стоял бы ответ.',
 f:'вопросительное слово на месте ответа + -아/어요?',
 e:[['무슨 음식을 좋아해요?','Какую еду любишь?'],['몇 시에 일어나요?','Во сколько встаёшь?'],['왜 전화했어요?','Почему звонил?']]},
{id:'compare',lv:'A1+',t:'N보다 (더) / 제일 / 만큼',n:'Сравнение',src:'IK1 урок 8',
 ex:'N보다 — «чем N»: 지하철이 버스보다 빨라요 (метро быстрее автобуса). 더 (более) добавляют для ясности, 덜 — «менее». Превосходная степень: 제일 / 가장 (самый). 만큼 — «так же, как»: 저만큼. 중에서 — «из, среди».',
 f:'B가 A보다 (더) … · 제일 / 가장 + A · N만큼 · N 중에서',
 e:[['한국어가 영어보다 더 어려워요.','Корейский труднее английского.'],['뭐가 제일 맛있어요?','Что самое вкусное?'],['저는 형만큼 키가 커요.','Я такой же высокий, как брат.']]},

{id:'neyo',lv:'A2',t:'-네요',n:'Удивление, впечатление',src:'IK2 урок 9',
 ex:'Говорящий только что заметил что-то и делится впечатлением: 맛있네요! (ого, вкусно!), 비가 오네요 (о, дождь идёт). Основа + 네요; после ㄹ он выпадает: 사네요. Прошедшее: -았/었네요.',
 f:'V/A-네요 · -았/었네요 · N(이)네요',
 e:[['한국어를 잘하시네요!','Вы хорошо говорите по-корейски!'],['날씨가 정말 좋네요.','Погода и правда отличная.'],['벌써 열 시네요.','Уже десять часов.']]},
{id:'eunikka',lv:'A2',t:'-(으)니까',n:'Потому что (моё обоснование)',src:'IK2 урок 10',
 ex:'Причина, за которой обычно идёт просьба, предложение или совет: 비가 오니까 우산을 가져가세요. В отличие от -아/어서, с -(으)니까 можно использовать -세요, -(으)ㅂ시다, -(으)ㄹ까요. Прошедшее в первой части допускается: 먹었으니까.',
 f:'받침 + 으니까 · без 받침 / ㄹ + 니까 · -았/었으니까',
 e:[['시간이 없으니까 빨리 가요.','Времени нет, так что идём быстрее.'],['추우니까 옷을 많이 입으세요.','Холодно, оденьтесь теплее.'],['어제 많이 잤으니까 괜찮아요.','Вчера много спал, так что всё в порядке.']]},
{id:'aseo',lv:'A2',t:'-아/어서',n:'Причина; «сделав, …»',src:'IK2 урок 9',
 ex:'Два значения. Причина: 배가 아파서 못 갔어요. Нельзя с просьбами и предложениями (там -(으)니까), и в первой части не ставится прошедшее время. Последовательность, где второе действие вытекает из первого: 친구를 만나서 영화를 봤어요 (встретил друга и с ним посмотрел). Образуется как 아요/어요 без 요 + 서. Существительное: N이라서 / 여서.',
 f:'ㅏ/ㅗ + 아서 · остальные + 어서 · 하다 → 해서 · N이라서',
 e:[['늦어서 죄송합니다.','Извините за опоздание.'],['돈이 없어서 못 샀어요.','Не купил, потому что не было денег.'],['집에 가서 쉬었어요.','Пошёл домой и отдохнул.']]},
{id:'eumyeon',lv:'A2',t:'-(으)면',n:'Если, когда',src:'IK2 урок 11',
 ex:'Условие или будущее «когда»: 시간이 있으면 (если будет время), 봄이 오면 (когда придёт весна). После патчима 으면, без патчима и после ㄹ — 면. Во второй части часто -(으)ㄹ 거예요 или -(으)세요.',
 f:'받침 + 으면 · без 받침 / ㄹ + 면',
 e:[['시간이 있으면 같이 가요.','Если будет время, пойдём вместе.'],['한국에 가면 뭐 하고 싶어요?','Что хочешь делать, когда поедешь в Корею?'],['피곤하면 쉬세요.','Если устали, отдохните.']]},
{id:'eulgeyo',lv:'A2',t:'-(으)ㄹ게요',n:'Обещаю, я сделаю',src:'IK2 урок 10',
 ex:'Только о себе: решение, принятое с учётом собеседника, или обещание. 제가 할게요 (я сделаю), 내일 전화할게요. В вопросах не используется. Сравните с -(으)ㄹ 거예요 — это просто план.',
 f:'받침 + 을게요 · без 받침 / ㄹ + ㄹ게요',
 e:[['제가 계산할게요.','Я заплачу.'],['내일 다시 전화할게요.','Завтра перезвоню.'],['늦지 않을게요.','Не опоздаю.']]},
{id:'eullaeyo',lv:'A2',t:'-(으)ㄹ래요',n:'Хочешь …? Я буду …',src:'IK2 урок 11',
 ex:'Разговорное выражение желания и предложение собеседнику: 뭐 먹을래요? (что будешь?), 저는 커피 마실래요. Со старшими вежливее -(으)시겠어요?.',
 f:'받침 + 을래요 · без 받침 / ㄹ + ㄹ래요',
 e:[['같이 갈래요?','Пойдёшь со мной?'],['저는 안 갈래요.','Я не пойду.'],['뭐 마실래요?','Что будешь пить?']]},
{id:'a-juda',lv:'A2',t:'-아/어 주다 / 주세요',n:'Сделать для кого-то',src:'IK2 урок 10',
 ex:'주다 после глагола — действие в пользу другого: 도와주다 (помочь), 가르쳐 주다 (научить), 사 주다 (купить кому-то). Просьба: -아/어 주세요 (сделайте, пожалуйста). Если делают для старшего — 드리다: 도와드릴게요.',
 f:'V-아/어 주다 · V-아/어 주세요 · V-아/어 드리다',
 e:[['좀 도와주세요.','Помогите, пожалуйста.'],['친구가 한국어를 가르쳐 줬어요.','Друг научил меня корейскому.'],['사진을 찍어 주세요.','Сфотографируйте, пожалуйста.']]},
{id:'a-boda',lv:'A2',t:'-아/어 보다',n:'Попробовать; опыт',src:'IK2 урок 11',
 ex:'«Попробовать сделать»: 먹어 보세요 (попробуйте), 한번 입어 보세요. В прошедшем — опыт: 한국에 가 봤어요 (бывал в Корее). 보다 + 보다 не удваивается: вместо 봐 봐요 говорят 보세요.',
 f:'V-아/어 보다 · V-아/어 보세요 · V-아/어 봤어요',
 e:[['이거 한번 먹어 보세요.','Попробуйте это.'],['김치를 만들어 봤어요.','Пробовал готовить кимчи.'],['제주도에 가 봤어요?','Бывали на Чеджу?']]},
{id:'su-itda',lv:'A2',t:'-(으)ㄹ 수 있다 / 없다',n:'Могу, не могу',src:'IK2 урок 9',
 ex:'Возможность или умение. После патчима 을 수 있어요, без патчима и после ㄹ — ㄹ 수 있어요. 수 произносится [쑤]. 못 — короткий аналог 없어요.',
 f:'V-(으)ㄹ 수 있어요 · V-(으)ㄹ 수 없어요',
 e:[['한국어를 읽을 수 있어요.','Умею читать по-корейски.'],['내일은 만날 수 없어요.','Завтра встретиться не смогу.'],['운전할 수 있어요?','Умеете водить?']]},
{id:'aya-doeda',lv:'A2',t:'-아/어야 되다 / 하다',n:'Нужно, должен',src:'IK2 урок 12',
 ex:'Обязанность или необходимость. 되다 разговорнее, 하다 нейтральнее: 가야 돼요 = 가야 해요. Прошедшее: 가야 했어요. «Не обязательно» — 안 -아/어도 돼요.',
 f:'ㅏ/ㅗ + 아야 돼요 · остальные + 어야 돼요 · 하다 → 해야 돼요',
 e:[['내일 일찍 일어나야 돼요.','Завтра надо рано встать.'],['약을 먹어야 해요.','Нужно принять лекарство.'],['한국어를 열심히 공부해야 돼요.','Надо усердно учить корейский.']]},
{id:'ado-doeda',lv:'A2',t:'-아/어도 되다 / -(으)면 안 되다',n:'Можно, нельзя',src:'IK2 урок 12',
 ex:'Разрешение: -아/어도 돼요 (можно). Вопрос: 들어가도 돼요?. Запрет: -(으)면 안 돼요 (нельзя). «Не обязательно»: 안 -아/어도 돼요.',
 f:'V-아/어도 돼요 · V-(으)면 안 돼요 · 안 V-아/어도 돼요',
 e:[['여기 앉아도 돼요?','Можно здесь сесть?'],['사진을 찍으면 안 돼요.','Фотографировать нельзя.'],['오늘 안 와도 돼요.','Сегодня можно не приходить.']]},
{id:'modifiers',lv:'A2',t:'-(으)ㄴ / -는 / -(으)ㄹ + N',n:'Определения: «который»',src:'IK2 уроки 9, 13',
 ex:'Определение стоит перед существительным. Глагол: прошедшее -(으)ㄴ (먹은 음식 — еда, которую съел), настоящее -는 (먹는 음식 — которую ем), будущее -(으)ㄹ (먹을 음식 — которую буду есть). Прилагательное: -(으)ㄴ (예쁜 옷, 좋은 사람). 있다/없다 присоединяют -는: 맛있는 음식.',
 f:'V-(으)ㄴ N (прошедшее) · V-는 N (настоящее) · V-(으)ㄹ N (будущее) · A-(으)ㄴ N',
 e:[['어제 본 영화가 재미있었어요.','Фильм, который смотрел вчера, был интересный.'],['제가 좋아하는 음식은 김치찌개예요.','Моя любимая еда — кимчи-ччигэ.'],['내일 할 일이 많아요.','Завтра много дел.']]},
{id:'neun-geot',lv:'A2',t:'-는 것 / -기',n:'Действие как существительное',src:'IK2 урок 13',
 ex:'Превращает глагол в «действие»: 요리하는 것 (готовка), 책 읽는 것을 좋아해요. -기 короче и живёт в устойчивых выражениях: 읽기, 쓰기, 듣기, 말하기; 하기 싫어요; -기 쉽다/어렵다. В речи 것이→게, 것을→걸, 것은→건.',
 f:'V-는 것 (거) · V-기 · 것이 → 게, 것을 → 걸',
 e:[['저는 요리하는 것을 좋아해요.','Я люблю готовить.'],['한국어 듣기가 어려워요.','Аудирование по-корейски трудное.'],['운동하는 게 건강에 좋아요.','Заниматься спортом полезно для здоровья.']]},
{id:'gi-jeone',lv:'A2',t:'-기 전에 / -(으)ㄴ 후에',n:'Перед тем как, после того как',src:'IK2 урок 12',
 ex:'-기 전에 — «перед тем как»: 자기 전에 (перед сном). -(으)ㄴ 후에 (также -(으)ㄴ 다음에, -고 나서) — «после того как»: 먹은 후에, 끝난 다음에. С существительными: N 전에, N 후에 (수업 전에).',
 f:'V-기 전에 · V-(으)ㄴ 후에 / 다음에 · N 전에 / 후에',
 e:[['자기 전에 책을 읽어요.','Перед сном читаю книгу.'],['수업이 끝난 후에 뭐 할 거예요?','Что будешь делать после занятий?'],['손을 씻은 다음에 드세요.','Ешьте после того, как помоете руки.']]},
{id:'ryeogo',lv:'A2',t:'-(으)려고 하다 / -(으)려고',n:'Собираюсь; чтобы',src:'IK2 урок 13',
 ex:'-(으)려고 해요 — намерение, которое ещё не выполнено: 한국에 가려고 해요. -(으)려고 + глагол — цель действия: 선물을 사려고 돈을 모아요 (коплю, чтобы купить подарок). После патчима 으려고, иначе 려고.',
 f:'V-(으)려고 해요 · V-(으)려고 V',
 e:[['내년에 한국에 가려고 해요.','Собираюсь в следующем году в Корею.'],['살을 빼려고 운동해요.','Занимаюсь спортом, чтобы похудеть.'],['뭐 하려고 했어요?','Что собирался делать?']]},
{id:'get',lv:'A2',t:'-겠-',n:'Намерение и вежливое предположение',src:'IK2 урок 10',
 ex:'О себе — твёрдое намерение: 제가 하겠습니다. О другом — вежливое предположение: 맛있겠어요 (наверное, вкусно), 힘들겠어요 (должно быть, тяжело). Устойчивые: 알겠습니다, 모르겠어요, 잘 먹겠습니다.',
 f:'V/A-겠어요 · -겠습니다',
 e:[['제가 먼저 하겠습니다.','Я сделаю первым.'],['와, 맛있겠어요!','Ух, наверняка вкусно!'],['네, 알겠습니다.','Да, понял.']]},
{id:'jiyo',lv:'A2',t:'-지요? / -죠',n:'Ведь так? Подтверждение',src:'IK2 урок 9',
 ex:'Говорящий ждёт согласия: 날씨가 좋지요? (хорошая погода, правда?). В речи сокращается до 죠. Также мягко утверждает известное: 그렇죠 (конечно). Существительное: N이지요 / 이죠.',
 f:'V/A-지요? · N(이)지요? · -죠',
 e:[['한국어가 어렵지요?','Корейский трудный, да?'],['내일 오시죠?','Завтра придёте, верно?'],['그렇죠.','Именно так.']]},
{id:'neunde',lv:'A2',t:'-는데 / -(으)ㄴ데',n:'Фон, мягкий контраст, вступление',src:'IK2 урок 12',
 ex:'Даёт фон для следующей части: 비가 오는데 우산이 없어요. Глагол → -는데 (있다/없다 тоже), прилагательное → -(으)ㄴ데, существительное → 인데, прошедшее → -았/었는데. В конце предложения -는데요 смягчает или намекает.',
 f:'V-는데 · A-(으)ㄴ데 · N인데 · -았/었는데',
 e:[['배고픈데 뭐 먹을까요?','Я голоден, что поедим?'],['어제 갔는데 문이 닫혀 있었어요.','Вчера ходил, но было закрыто.'],['저는 한국 사람인데요.','Я вообще-то кореец.']]},
{id:'ttae',lv:'A2',t:'-(으)ㄹ 때',n:'Когда, во время',src:'IK2 урок 12',
 ex:'«Когда, во время того как»: 밥 먹을 때 (когда ем), 어렸을 때 (когда был маленьким — с прошедшим). С существительными: 방학 때, 시험 때. -(으)ㄹ 때마다 — каждый раз, когда.',
 f:'V/A-(으)ㄹ 때 · -았/었을 때 · N 때 · -(으)ㄹ 때마다',
 e:[['한국에 갔을 때 김치를 많이 먹었어요.','Когда ездил в Корею, ел много кимчи.'],['시간이 있을 때 연락하세요.','Свяжитесь, когда будет время.'],['피곤할 때 커피를 마셔요.','Когда устаю, пью кофе.']]},
{id:'ttaemune',lv:'A2',t:'때문에 / -기 때문에',n:'Из-за, потому что (нейтрально)',src:'IK2 урок 11',
 ex:'N 때문에 — «из-за N»: 비 때문에. V/A-기 때문에 — нейтральная причина, чаще в письменной речи. Не используется с просьбами и предложениями. -기 때문이에요 — «это потому, что».',
 f:'N 때문에 · V/A-기 때문에 · -기 때문이에요',
 e:[['일 때문에 못 갔어요.','Не смог пойти из-за работы.'],['비가 오기 때문에 집에 있어요.','Сижу дома, потому что идёт дождь.'],['한국 드라마 때문에 한국어를 배워요.','Учу корейский из-за дорам.']]},

{id:'quotation',lv:'A2+',t:'-다고 / -냐고 / -자고 / -라고 하다',n:'Косвенная речь',src:'IK2 уроки 15–16',
 ex:'Пересказ чужих слов. Утверждение: глагол -ㄴ/는다고 (간다고, 먹는다고), прилагательное -다고 (좋다고), существительное -(이)라고, прошедшее -았/었다고. Вопрос: -냐고. Предложение «давай»: -자고. Приказ или просьба: -(으)라고. Сокращения в речи: 간대요 (= 간다고 해요), 가래요, 가재요, 가냬요.',
 f:'V-ㄴ/는다고 하다 · A-다고 · N(이)라고 · -냐고 / -자고 / -(으)라고',
 e:[['친구가 내일 온다고 했어요.','Друг сказал, что придёт завтра.'],['선생님이 숙제를 하라고 하셨어요.','Учитель велел сделать домашку.'],['같이 가자고 했어요.','Предложил пойти вместе.']]},
{id:'jeok-itda',lv:'A2+',t:'-(으)ㄴ 적이 있다 / 없다',n:'Опыт: доводилось, не доводилось',src:'IK2 урок 14',
 ex:'«Случалось ли когда-нибудь»: 한국에 간 적이 있어요. Часто с -아/어 본 적이 있다: 먹어 본 적이 없어요 (никогда не пробовал).',
 f:'V-(으)ㄴ 적이 있어요 / 없어요 · V-아/어 본 적이 있어요',
 e:[['김치를 먹어 본 적이 있어요?','Доводилось пробовать кимчи?'],['한국에 가 본 적이 없어요.','Никогда не был в Корее.'],['그 사람을 만난 적이 있어요.','Я встречался с этим человеком.']]},
{id:'eumyeonseo',lv:'A2+',t:'-(으)면서',n:'Одновременно: делая одно, делать другое',src:'IK2 урок 14',
 ex:'Два действия одного субъекта в одно время: 음악을 들으면서 공부해요. После патчима 으면서, иначе 면서. С прилагательными — «и при этом»: 싸면서 맛있어요.',
 f:'V-(으)면서 V · A-(으)면서 A',
 e:[['음악을 들으면서 운동해요.','Занимаюсь спортом, слушая музыку.'],['밥을 먹으면서 TV를 봐요.','Смотрю телевизор за едой.'],['웃으면서 말했어요.','Сказал с улыбкой.']]},
{id:'neun-dongan',lv:'A2+',t:'-는 동안 / N 동안',n:'В течение, пока',src:'IK2 урок 14',
 ex:'Продолжительность: 방학 동안 (на каникулах), 두 시간 동안 (в течение двух часов). С глаголом: -는 동안 (пока …): 제가 요리하는 동안 청소해 주세요.',
 f:'N 동안 · V-는 동안',
 e:[['세 시간 동안 공부했어요.','Занимался три часа.'],['제가 없는 동안 전화가 왔어요?','Пока меня не было, звонили?'],['방학 동안 뭐 했어요?','Что делал на каникулах?']]},
{id:'eun-ji',lv:'A2+',t:'-(으)ㄴ 지 (시간) 되다',n:'Прошло столько-то времени с тех пор, как',src:'IK2 урок 14',
 ex:'Сколько времени прошло с начала действия: 한국어를 배운 지 1년 됐어요 (учу корейский уже год). Глагол в форме -(으)ㄴ 지 + период + 됐어요 / 지났어요. Вопрос: 얼마나 됐어요?',
 f:'V-(으)ㄴ 지 + время + 됐어요 / 지났어요',
 e:[['한국어를 배운 지 일 년이 됐어요.','Учу корейский уже год.'],['결혼한 지 얼마나 됐어요?','Как давно вы женаты?'],['밥을 먹은 지 한 시간밖에 안 됐어요.','Прошёл всего час, как поел.']]},
{id:'giro-hada',lv:'A2+',t:'-기로 하다',n:'Решил, договорился',src:'IK2 урок 15',
 ex:'Принятое решение или договорённость, обычно в прошедшем: 담배를 끊기로 했어요 (решил бросить курить), 내일 만나기로 했어요 (договорились встретиться завтра).',
 f:'V-기로 했어요',
 e:[['매일 운동하기로 했어요.','Решил заниматься каждый день.'],['친구하고 주말에 만나기로 했어요.','Договорился с другом встретиться на выходных.'],['한국어를 열심히 공부하기로 했어요.','Решил усердно учить корейский.']]},
{id:'ge',lv:'A2+',t:'-게 / -게 되다',n:'Наречия; «получилось так, что»',src:'IK2 уроки 13, 16',
 ex:'-게 делает из прилагательного наречие: 맛있게 (вкусно), 재미있게, 늦게 (поздно), 크게. -게 되다 — изменение обстоятельств не по своей воле: 한국에 가게 됐어요 (так вышло, что еду в Корею), 알게 됐어요 (узнал).',
 f:'A-게 · V-게 되다 · V-게 됐어요',
 e:[['맛있게 드세요.','Приятного аппетита.'],['한국에서 일하게 됐어요.','Так получилось, что буду работать в Корее.'],['그 사람을 좋아하게 됐어요.','Я полюбил этого человека.']]},
{id:'ji-malda',lv:'A2+',t:'-지 마세요 / -지 말고',n:'Не делайте; не это, а …',src:'IK2 урок 12',
 ex:'Запрет-просьба: 걱정하지 마세요 (не волнуйтесь). Разговорно: -지 마. -지 말고 — «не делая X, (сделайте) Y». С существительными просто 말고: 커피 말고 차 주세요.',
 f:'V-지 마세요 · V-지 말고 V · N 말고 N',
 e:[['여기서 사진을 찍지 마세요.','Не фотографируйте здесь.'],['걱정하지 마세요.','Не волнуйтесь.'],['버스 말고 지하철을 타세요.','Поезжайте не на автобусе, а на метро.']]},
{id:'geot-gatta',lv:'A2+',t:'-(으)ㄴ / 는 / (으)ㄹ 것 같다',n:'Кажется, похоже',src:'IK2 урок 15',
 ex:'Мягкое предположение или смягчённое мнение. Глагол: прошедшее -(으)ㄴ 것 같아요, настоящее -는 것 같아요, будущее -(으)ㄹ 것 같아요. Прилагательное: -(으)ㄴ 것 같아요. Существительное: 인 것 같아요. Корейцы часто так выражают мнение, чтобы не звучать резко.',
 f:'V-는 것 같아요 · V-(으)ㄴ 것 같아요 (прошедшее) · V/A-(으)ㄹ 것 같아요 (будущее, предположение)',
 e:[['비가 올 것 같아요.','Кажется, будет дождь.'],['그 영화는 재미있는 것 같아요.','По-моему, этот фильм интересный.'],['성민 씨는 벌써 간 것 같아요.','Похоже, Сонмин уже ушла.']]},
{id:'banmal',lv:'A2+',t:'반말: -아/어, -야, -자',n:'Неформальная речь',src:'IK2 урок 15',
 ex:'С близкими друзьями, младшими и детьми. Убираем 요: 가요→가, 먹어요→먹어. Связка: 이야 / 야 (학생이야, 친구야). Вопросы — те же формы с интонацией. Предложение «давай»: -자 (가자). Приказ: -아/어 (빨리 와). «Я» — 나 / 내가, «ты» — 너 / 네가 [니가]. Обращение к другу: имя + 아/야.',
 f:'-아/어요 → -아/어 · N이야 / 야 · V-자 · 나, 너',
 e:[['뭐 해?','Что делаешь?'],['내일 같이 가자.','Пойдём завтра вместе.'],['나는 학생이야.','Я студент.']]},
{id:'passive',lv:'A2+',t:'피동: -이 / 히 / 리 / 기',n:'Страдательный залог',src:'IK2 урок 16',
 ex:'Подлежащее испытывает действие. Образуется суффиксами: 보다→보이다 (виднеться), 먹다→먹히다, 열다→열리다 (открываться), 닫다→닫히다, 쓰다→쓰이다, 듣다→들리다 (слышаться), 잡다→잡히다, 팔다→팔리다. У глаголов на 하다: 하다→되다 (시작되다, 사용되다). Также -아/어지다: 만들어지다, 알려지다.',
 f:'V + 이 / 히 / 리 / 기 · N하다 → N되다 · V-아/어지다',
 e:[['문이 열렸어요.','Дверь открылась.'],['소리가 안 들려요.','Не слышно звука.'],['이 책은 잘 팔려요.','Эта книга хорошо продаётся.']]},
{id:'causative',lv:'A2+',t:'사동: -이 / 히 / 리 / 기 / 우 / 추, -게 하다',n:'Побудительный залог',src:'IK2 урок 17',
 ex:'Заставить или дать сделать: 먹다→먹이다 (кормить), 입다→입히다 (одевать кого-то), 자다→재우다 (укладывать спать), 울다→울리다 (доводить до слёз), 웃다→웃기다 (смешить), 앉다→앉히다, 낮다→낮추다. Универсальный способ: -게 하다 (아이를 공부하게 했어요).',
 f:'V + 이 / 히 / 리 / 기 / 우 / 추 · V-게 하다',
 e:[['아이에게 밥을 먹였어요.','Покормил ребёнка.'],['그 영화가 저를 울렸어요.','Этот фильм довёл меня до слёз.'],['선생님이 학생들에게 책을 읽게 했어요.','Учитель заставил учеников читать.']]},
{id:'a-beorida',lv:'A2+',t:'-아/어 버리다 / -아/어 놓다 / 두다',n:'Завершённость; сделать заранее',src:'IK2 урок 17',
 ex:'-아/어 버리다 — действие завершилось полностью, часто с оттенком сожаления или облегчения: 다 먹어 버렸어요 (всё съел), 잊어버렸어요 (забыл). -아/어 놓다 / 두다 — сделать заранее и оставить так: 창문을 열어 놓았어요 (окно открыто), 예약해 두었어요 (забронировал заранее).',
 f:'V-아/어 버리다 · V-아/어 놓다 · V-아/어 두다',
 e:[['숙제를 다 해 버렸어요.','Всю домашку доделал.'],['열쇠를 잃어버렸어요.','Потерял ключи.'],['미리 표를 사 두었어요.','Заранее купил билеты.']]},
{id:'eunji-alda',lv:'A2+',t:'-(으)ㄴ / 는지 알다 / 모르다',n:'Косвенный вопрос',src:'IK2 урок 16',
 ex:'Вводит вопрос внутрь предложения: 어디에 사는지 알아요? (знаешь, где он живёт?). Глагол — -는지, прилагательное — -(으)ㄴ지, прошедшее — -았/었는지, существительное — 인지. Часто с 알다, 모르다, 궁금하다, 물어보다.',
 f:'V-는지 / A-(으)ㄴ지 / N인지 + 알아요 / 몰라요',
 e:[['그 사람이 누구인지 몰라요.','Не знаю, кто это.'],['몇 시에 시작하는지 아세요?','Знаете, во сколько начинается?'],['왜 안 왔는지 물어봤어요.','Спросил, почему не пришёл.']]},
{id:'ado',lv:'A2+',t:'-아/어도',n:'Даже если, хотя',src:'IK2 урок 16',
 ex:'Уступка: 비가 와도 갈 거예요 (пойду, даже если будет дождь). Образуется как 아/어요 без 요 + 도. С существительным: N이어도 / 여도. Часто с 아무리: 아무리 바빠도 (как бы ни был занят).',
 f:'V/A-아/어도 · 아무리 -아/어도 · N이어도',
 e:[['아무리 바빠도 운동해요.','Как бы ни был занят, занимаюсь спортом.'],['비싸도 살 거예요.','Куплю, даже если дорого.'],['피곤해도 숙제를 해야 돼요.','Хоть и устал, надо делать домашку.']]},
{id:'wihae',lv:'A2+',t:'-기 위해(서) / N을/를 위해(서)',n:'Для того чтобы; ради',src:'IK2 урок 17',
 ex:'Цель: 한국어를 배우기 위해서 한국에 왔어요 (приехал в Корею, чтобы учить корейский). С существительным: 가족을 위해서 (ради семьи), 건강을 위해 (для здоровья). Книжнее, чем -(으)러 и -(으)려고.',
 f:'V-기 위해(서) · N을/를 위해(서)',
 e:[['시험에 합격하기 위해서 열심히 공부해요.','Усердно учусь, чтобы сдать экзамен.'],['가족을 위해서 일해요.','Работаю ради семьи.'],['건강을 위해 매일 걸어요.','Хожу пешком каждый день ради здоровья.']]},
{id:'sigesseoyo',lv:'A2+',t:'-(으)시겠어요? / -(으)실래요?',n:'Вежливое предложение старшему',src:'IK2 урок 16',
 ex:'Самый вежливый способ предложить или спросить о желании: 뭐 드시겠어요? (что будете?), 앉으시겠어요?. Менее формально: -(으)실래요?. Это 시 (уважение) + 겠 или 래요. Предложить свою помощь: -아/어 드릴까요?.',
 f:'V-(으)시겠어요? · V-(으)실래요? · V-아/어 드릴까요?',
 e:[['뭐 드시겠어요?','Что будете заказывать?'],['창문을 열어 드릴까요?','Открыть вам окно?'],['같이 가실래요?','Пойдёте с нами?']]},

{id:'na-boda',lv:'B1',t:'-나 보다 / -(으)ㄴ가 보다',n:'Похоже, видимо (по признакам)',src:'TOPIK 3',
 ex:'Вывод из наблюдения, а не из знания: 불이 꺼져 있네요. 자나 봐요 (свет выключен — видимо, спит). Глагол → -나 보다 (прошедшее -았/었나 보다), прилагательное → -(으)ㄴ가 보다, существительное → 인가 보다. Только о других, не о себе.',
 f:'V-나 봐요 · A-(으)ㄴ가 봐요 · N인가 봐요 · -았/었나 봐요',
 e:[['밖에 비가 오나 봐요.','Кажется, на улице дождь.'],['저 식당이 맛있나 봐요. 사람이 많아요.','Видимо, тот ресторан вкусный: там много людей.'],['성민 씨는 바쁜가 봐요.','Сонмин, похоже, занята.']]},
{id:'daga',lv:'B1',t:'-다가 / -았/었다가',n:'Делал и переключился; сделал, потом обратное',src:'TOPIK 3',
 ex:'Действие прервалось и перешло в другое: 공부하다가 잤어요 (учился и уснул). Также причина неприятности: 뛰다가 넘어졌어요 (бежал и упал). -았/었다가 — действие завершилось, затем последовало противоположное: 갔다가 왔어요 (сходил и вернулся), 입었다가 벗었어요.',
 f:'V-다가 V · V-았/었다가 V',
 e:[['집에 가다가 친구를 만났어요.','По пути домой встретил друга.'],['영화를 보다가 잠이 들었어요.','Смотрел фильм и уснул.'],['창문을 열었다가 닫았어요.','Открыл окно и закрыл.']]},
{id:'deon',lv:'B1',t:'-던 / -았/었던',n:'Вспоминаемое прошлое',src:'TOPIK 3',
 ex:'Определение с воспоминанием. -던 — привычное или незаконченное в прошлом: 자주 가던 카페 (кафе, куда часто ходил), 먹던 빵 (недоеденный хлеб). -았/었던 — завершённое, однократное: 작년에 갔던 식당. Сравните с -(으)ㄴ — просто факт прошлого.',
 f:'V-던 N · V-았/었던 N',
 e:[['어렸을 때 살던 집이에요.','Это дом, где я жил в детстве.'],['지난주에 봤던 영화를 또 봤어요.','Снова посмотрел фильм, который смотрел на прошлой неделе.'],['제가 마시던 커피 어디 있어요?','Где кофе, который я пил?']]},
{id:'deora',lv:'B1',t:'-더라고요 / -던데요',n:'Сам видел, что …',src:'TOPIK 3',
 ex:'Передача того, что говорящий лично наблюдал в прошлом: 그 식당 진짜 맛있더라고요 (я там был — правда вкусно). -던데요 — то же с оттенком «а вот…» и ожиданием реакции. Не о своих действиях, кроме чувств: 좋더라고요.',
 f:'V/A-더라고요 · V/A-던데요 · N(이)더라고요',
 e:[['어제 그 영화 봤는데 재미있더라고요.','Вчера смотрел тот фильм: оказалось интересно.'],['성민 씨가 한국어를 정말 잘하던데요.','Сонмин, оказывается, отлично говорит по-корейски.'],['밖에 눈이 오더라고요.','Я видел: на улице шёл снег.']]},
{id:'eulsurok',lv:'B1',t:'-(으)ㄹ수록',n:'Чем …, тем …',src:'TOPIK 3',
 ex:'Пропорция: 많이 연습할수록 잘해요 (чем больше практикуешься, тем лучше). Часто с -(으)면 для усиления: 보면 볼수록 (чем больше смотрю). После патчима 을수록, иначе ㄹ수록. 갈수록 — «со временем всё больше».',
 f:'V/A-(으)ㄹ수록 · V-(으)면 V-(으)ㄹ수록 · 갈수록',
 e:[['한국어는 배울수록 재미있어요.','Чем больше учишь корейский, тем интереснее.'],['날씨가 갈수록 추워져요.','Погода становится всё холоднее.'],['사람이 많을수록 좋아요.','Чем больше людей, тем лучше.']]},
{id:'baram',lv:'B1',t:'-는 바람에',n:'Из-за (неожиданная причина, плохой результат)',src:'TOPIK 3',
 ex:'Непредвиденная причина, которая привела к негативному следствию, обычно в прошедшем: 늦잠을 자는 바람에 지각했어요 (проспал и опоздал). Только с глаголами и всегда в форме -는 바람에, без прошедшего в первой части.',
 f:'V-는 바람에 + (прошедшее)',
 e:[['비가 오는 바람에 경기가 취소됐어요.','Из-за дождя матч отменили.'],['버스를 놓치는 바람에 늦었어요.','Опоздал, потому что упустил автобус.'],['핸드폰이 고장 나는 바람에 연락을 못 했어요.','Телефон сломался, и я не смог связаться.']]},
{id:'deokbune',lv:'B1',t:'덕분에 / 탓에',n:'Благодаря; по вине',src:'TOPIK 3',
 ex:'덕분에 — положительная причина, «благодаря»: 선생님 덕분에 합격했어요. 탓에 — отрицательная, «по вине, из-за»: 날씨 탓에 못 갔어요. С глаголом: -(으)ㄴ 덕분에 (прошедшее), -는 덕분에. Ответ на благодарность: 덕분에요.',
 f:'N 덕분에 · V-(으)ㄴ / 는 덕분에 · N 탓에 · V-(으)ㄴ / 는 탓에',
 e:[['친구가 도와준 덕분에 끝냈어요.','Закончил благодаря помощи друга.'],['늦잠을 잔 탓에 지각했어요.','Опоздал из-за того, что проспал.'],['덕분에 잘 지냈어요.','Благодаря вам всё хорошо.']]},
{id:'tende',lv:'B1',t:'-(으)ㄹ 텐데 / -(으)ㄹ 테니까',n:'Наверняка …, так что …',src:'TOPIK 3',
 ex:'-(으)ㄹ 텐데 — сильное предположение с фоном: 피곤할 텐데 좀 쉬세요 (вы наверняка устали, отдохните). -(으)ㄹ 테니까 — «я сделаю / наверняка будет, так что»: 제가 할 테니까 걱정 마세요. 테 — сокращение от 터 (намерение, вероятность).',
 f:'V/A-(으)ㄹ 텐데 · V-(으)ㄹ 테니까',
 e:[['배고플 텐데 먼저 드세요.','Вы наверняка голодны, ешьте первым.'],['제가 전화할 테니까 기다리세요.','Я позвоню, так что ждите.'],['지금 가면 늦을 텐데요.','Если пойти сейчас, наверняка опоздаем.']]},
{id:'dorok',lv:'B1',t:'-도록',n:'Так, чтобы; до тех пор, пока',src:'TOPIK 3',
 ex:'Цель или степень: 잊지 않도록 메모하세요 (запишите, чтобы не забыть), 밤새도록 (всю ночь напролёт). -도록 하다 — мягкая инструкция: 내일까지 제출하도록 하세요. О себе: 늦지 않도록 하겠습니다 (постараюсь не опоздать).',
 f:'V-도록 V · V-도록 하세요 · V-도록 하겠습니다',
 e:[['감기에 걸리지 않도록 조심하세요.','Берегитесь, чтобы не простудиться.'],['모두가 들을 수 있도록 크게 말하세요.','Говорите громко, чтобы все слышали.'],['늦지 않도록 하겠습니다.','Постараюсь не опоздать.']]},
{id:'janayo',lv:'B1',t:'-잖아요',n:'Ведь же (напоминаю очевидное)',src:'TOPIK 3',
 ex:'Напоминание о том, что собеседник и так знает или должен знать: 어제 말했잖아요 (я же вчера говорил). Произошло от -지 않아요. Может звучать резковато, со старшими — осторожно. Существительное: N(이)잖아요.',
 f:'V/A-잖아요 · -았/었잖아요 · N(이)잖아요',
 e:[['오늘 일요일이잖아요.','Сегодня же воскресенье.'],['제가 어제 말했잖아요.','Я же вчера говорил.'],['한국 음식은 맵잖아요.','Корейская еда ведь острая.']]},
{id:'gineun',lv:'B1',t:'-기는 하지만 / -기는 하다',n:'Хоть и …, но …',src:'TOPIK 3',
 ex:'Частичное согласие: 맛있기는 한데 비싸요 (вкусно-то вкусно, но дорого). Глагол может повторяться: 가기는 가요 (пойти-то пойду). Разговорное сокращение: 맛있긴 한데.',
 f:'V/A-기는 하지만 / 한데 · V-기는 V · -긴 한데',
 e:[['한국어를 배우기는 하지만 아직 잘 못해요.','Корейский-то учу, но пока плохо говорю.'],['좋기는 한데 너무 비싸요.','Хорошо, но слишком дорого.'],['먹기는 먹었어요.','Поесть-то поел.']]},
{id:'ppeon',lv:'B1',t:'-(으)ㄹ 뻔하다',n:'Чуть не …',src:'TOPIK 3',
 ex:'Что-то едва не случилось, но не случилось. Всегда в прошедшем: 넘어질 뻔했어요 (чуть не упал), 늦을 뻔했어요. Часто с 하마터면 (чуть было не).',
 f:'V-(으)ㄹ 뻔했어요 · 하마터면 V-(으)ㄹ 뻔했어요',
 e:[['버스를 놓칠 뻔했어요.','Чуть не упустил автобус.'],['하마터면 잊어버릴 뻔했어요.','Чуть было не забыл.'],['교통사고가 날 뻔했어요.','Чуть не попал в аварию.']]},
{id:'chae',lv:'B1',t:'-(으)ㄴ 채로',n:'В неизменённом состоянии',src:'TOPIK 3',
 ex:'Действие совершается при сохранении предыдущего состояния: 신발을 신은 채로 들어왔어요 (вошёл, не сняв обуви), 불을 켠 채로 잤어요. Только с -(으)ㄴ; 로 можно опустить.',
 f:'V-(으)ㄴ 채(로) V',
 e:[['옷을 입은 채로 잤어요.','Уснул в одежде.'],['문을 연 채로 나갔어요.','Ушёл, оставив дверь открытой.'],['눈을 감은 채 음악을 들었어요.','Слушал музыку с закрытыми глазами.']]},
{id:'daero',lv:'B1',t:'-는 대로 / N대로',n:'Как; сразу как только',src:'TOPIK 3',
 ex:'«Так, как»: 제가 하는 대로 하세요 (делайте, как я), 계획대로 (по плану), 마음대로 (как хочешь). «Сразу как только» с будущим: 도착하는 대로 연락할게요. Прошедшее: -(으)ㄴ 대로 (들은 대로 — как слышал).',
 f:'V-는 대로 · V-(으)ㄴ 대로 · N대로',
 e:[['선생님이 말씀하신 대로 했어요.','Сделал так, как сказал учитель.'],['집에 도착하는 대로 전화할게요.','Позвоню, как только приду домой.'],['마음대로 하세요.','Делайте как хотите.']]},
{id:'banmyeone',lv:'B1',t:'-는 반면에 / -(으)ㄴ 반면에',n:'Тогда как, с другой стороны',src:'TOPIK 3',
 ex:'Противопоставление двух сторон: 형은 조용한 반면에 동생은 활발해요. Глагол → -는 반면에, прилагательное → -(으)ㄴ 반면에. Отдельное 반면에 в начале предложения — «с другой стороны».',
 f:'V-는 반면에 · A-(으)ㄴ 반면에',
 e:[['이 식당은 맛있는 반면에 비싸요.','Этот ресторан вкусный, но при этом дорогой.'],['서울은 복잡한 반면에 편리해요.','Сеул суетливый, зато удобный.'],['읽기는 쉬운 반면에 말하기는 어려워요.','Читать легко, тогда как говорить трудно.']]},
{id:'eumyeon-jokketda',lv:'B1',t:'-았/었으면 좋겠다',n:'Хотелось бы, вот бы',src:'TOPIK 3',
 ex:'Желание или надежда, в том числе нереальная: 돈이 많았으면 좋겠어요 (вот бы было много денег), 빨리 방학이 왔으면 좋겠어요. Форма -(으)면 좋겠다 без прошедшего тоже возможна, с -았/었- звучит сильнее.',
 f:'V/A-았/었으면 좋겠어요 · V/A-(으)면 좋겠어요',
 e:[['한국어를 잘했으면 좋겠어요.','Хотел бы хорошо говорить по-корейски.'],['내일 날씨가 좋았으면 좋겠어요.','Хорошо бы завтра была хорошая погода.'],['빨리 주말이 왔으면 좋겠어요.','Скорей бы выходные.']]},
{id:'geol-geuraetda',lv:'B1',t:'-(으)ㄹ걸 그랬다 / -(으)ㄹ걸요',n:'Надо было …; наверное …',src:'TOPIK 3',
 ex:'-(으)ㄹ걸 그랬어요 — сожаление о несделанном: 우산을 가져올걸 그랬어요 (надо было взять зонт). В речи часто просто -(으)ㄹ걸 с падающей интонацией. -(으)ㄹ걸요 с восходящей интонацией — мягкое предположение: 벌써 갔을걸요 (наверное, уже ушёл).',
 f:'V-(으)ㄹ걸 그랬어요 · V/A-(으)ㄹ걸요 · -았/었을걸요',
 e:[['더 열심히 공부할걸 그랬어요.','Надо было учиться усерднее.'],['미리 예약할걸.','Надо было забронировать заранее.'],['지금쯤 집에 도착했을걸요.','Наверное, сейчас уже дома.']]},
{id:'dedaga',lv:'B1',t:'-(으)ㄴ / 는 데다가',n:'Вдобавок, к тому же',src:'TOPIK 3',
 ex:'Добавляет второй факт того же знака: 이 집은 싼 데다가 맛있어요 (дёшево и вдобавок вкусно). Глагол → -는 데다가, прилагательное → -(으)ㄴ 데다가, существительное → 인 데다가. Отдельное слово 게다가 — «к тому же» в начале предложения.',
 f:'V-는 데다가 · A-(으)ㄴ 데다가 · N인 데다가',
 e:[['비가 오는 데다가 바람도 불어요.','Идёт дождь, да ещё и ветер.'],['그 사람은 똑똑한 데다가 친절해요.','Он умный и к тому же добрый.'],['피곤한 데다가 배도 고파요.','Устал, да ещё и голоден.']]},
{id:'deoni',lv:'B1',t:'-더니 / -았/었더니',n:'Наблюдал, и затем …; сделал, и в результате …',src:'TOPIK 3',
 ex:'-더니 — о другом человеке: наблюдал одно, потом последовало другое: 아침에는 춥더니 지금은 따뜻해요. -았/었더니 — о себе: сделал, и вот результат: 약을 먹었더니 나았어요 (принял лекарство, и прошло). Субъект первой части: у -더니 это не я, у -았/었더니 — я.',
 f:'V/A-더니 (о других) · V-았/었더니 (о себе)',
 e:[['동생이 열심히 공부하더니 시험에 합격했어요.','Брат усердно учился, и вот сдал экзамен.'],['커피를 많이 마셨더니 잠이 안 와요.','Выпил много кофе, и теперь не спится.'],['어제는 비가 오더니 오늘은 맑아요.','Вчера шёл дождь, а сегодня ясно.']]},
{id:'manhada',lv:'B1',t:'-(으)ㄹ 만하다',n:'Стоит того, чтобы; вполне сносно',src:'TOPIK 3',
 ex:'Что-то заслуживает действия или приемлемо: 볼 만한 영화 (фильм, который стоит посмотреть), 먹을 만해요 (есть можно, неплохо), 믿을 만한 사람 (человек, которому можно доверять).',
 f:'V-(으)ㄹ 만해요 · V-(으)ㄹ 만한 N',
 e:[['이 책은 읽을 만해요.','Эту книгу стоит прочитать.'],['서울에서 가 볼 만한 곳이 어디예요?','Куда стоит сходить в Сеуле?'],['음식이 먹을 만했어요.','Еда была вполне съедобная.']]},
{id:'geona-deunji',lv:'B1',t:'-거나 / -든지 / (이)나',n:'Или; хоть …, хоть …',src:'TOPIK 3',
 ex:'-거나 соединяет действия: 주말에는 책을 읽거나 영화를 봐요 (читаю или смотрю кино). Существительные соединяет (이)나: 커피나 차. -든지 — «неважно, что или какой»: 뭐든지 (что угодно), 언제든지 (когда угодно), 가든지 말든지 (хоть иди, хоть нет).',
 f:'V-거나 V · N(이)나 N · V-든지 · 뭐든지 / 언제든지 / 어디든지',
 e:[['주말에는 운동하거나 친구를 만나요.','На выходных занимаюсь спортом или встречаюсь с друзьями.'],['언제든지 전화하세요.','Звоните в любое время.'],['버스나 지하철을 타세요.','Поезжайте на автобусе или метро.']]},

{id:'euro-inhae',lv:'B1+',t:'(으)로 인해(서) / -(으)므로',n:'Письменные причины',src:'TOPIK 3',
 ex:'Книжные и официальные причины. N(으)로 인해(서) — «вследствие N»: 폭설로 인해 항공편이 취소되었습니다. V/A-(으)므로 — «поскольку», в объявлениях и текстах: 위험하므로 들어가지 마십시오. В разговоре их заменяют 때문에 и -(으)니까.',
 f:'N(으)로 인해(서) · V/A-(으)므로',
 e:[['사고로 인해 길이 막혔습니다.','Из-за аварии дорога перекрыта.'],['시간이 부족하므로 서둘러야 합니다.','Поскольку времени мало, надо спешить.'],['비가 많이 오므로 행사가 연기되었습니다.','Так как сильный дождь, мероприятие перенесено.']]},
{id:'jung-gyeom',lv:'B1+',t:'-는 중이다 / -(으)ㄹ 겸',n:'В процессе; заодно',src:'TOPIK 3',
 ex:'-는 중이에요 — «в процессе, как раз сейчас»: 회의 중이에요 (на совещании), 가는 중이에요 (в пути). -(으)ㄹ 겸 — две цели сразу: 운동도 할 겸 산책했어요 (погулял, заодно и размялся). Часто: 겸사겸사 (заодно).',
 f:'V-는 중이에요 · N 중이에요 · V-(으)ㄹ 겸 V',
 e:[['지금 가는 중이에요.','Я сейчас в пути.'],['친구도 만날 겸 서울에 갔어요.','Поехал в Сеул, заодно и с другом встретиться.'],['공부도 할 겸 한국 드라마를 봐요.','Смотрю дорамы, заодно и учусь.']]},
{id:'aya-jiyo',lv:'B1+',t:'-아/어야지요 / -아/어야겠다',n:'Надо бы; придётся',src:'TOPIK 3',
 ex:'-아/어야지요 (в речи -아/어야죠) — напоминание о должном: 약속은 지켜야지요 (обещания надо выполнять). -아/어야겠어요 — решение, принятое только что: 이제 자야겠어요 (пора спать).',
 f:'V-아/어야지요 (야죠) · V-아/어야겠어요',

{id:'ppunman',lv:'B1+',t:'뿐만 아니라 / -(으)ㄹ 뿐이다',n:'Не только, но и; всего лишь',src:'TOPIK 3',

  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:TOKEN,...(payload||{})})});

  if(!r.ok){ const code=j.error||('http_'+r.status); if(code==='unauthorized'&&TOKEN) logout(); const err=new Error(code); err.code=code; err.text=j.text; err.detail=j.detail; throw err; }

}

function tp(id){ return state.topics[id]||{s:0,n:0,c:0,t:0}; }
function status(t){ const p=tp(t.id); if(p.s>=0.8&&p.n>0) return ['Освоена','ok']; if(p.s>=0.8) return ['Знакома','ok']; if(p.n>0||t.k){ return p.s<0.5?['Повторить','warn']:['Учу','acc']; } return ['Новая','']; }
function mastered(){ return T.filter(t=>tp(t.id).s>=0.8).length; }
function levelReached(){ let r='до A1'; for(const L of LEVELS){ const ts=T.filter(t=>t.lv===L.id); const m=ts.filter(t=>tp(t.id).s>=0.8).length; if(m/ts.length>=0.7) r=L.id; else break; } return r; }
function nextNew(){ return T.find(t=>!t.k&&tp(t.id).n===0); }
function weakTopics(n){ return T.filter(t=>(tp(t.id).n>0||t.k)&&tp(t.id).s<0.8).sort((a,b)=>tp(a.id).s-tp(b.id).s||tp(a.id).t-tp(b.id).t).slice(0,n); }
function streak(){ let d=new Date(), n=0; const k=x=>x.toISOString().slice(0,10); if(!state.days[k(d)]) d.setDate(d.getDate()-1); while(state.days[k(d)]){ n++; d.setDate(d.getDate()-1); } return n; }
function updateTopic(id,ok){ const p=tp(id); p.n++; if(ok) p.c++; p.s=Math.max(0,Math.min(1, ok? p.s+(1-p.s)*0.25 : p.s-p.s*0.3)); p.t=Date.now(); state.topics[id]=p; state.days[today()]=(state.days[today()]||0)+1; save(); }
function norm(s){ return String(s||'').toLowerCase().replace(/[\s.,!?~…·'"“”‘’()\[\]-]/g,''); }
function pickTrainingTopics(){
  const weak=weakTopics(3); const nn=nextNew(); const out=[];
  if(weak.length&&weak[0].s<0.5) out.push(weak[0]);
  if(nn) out.push(nn); else if(weak[1]) out.push(weak[1]);
  if(!out.length&&weak.length) out.push(weak[0]);
  if(out.length<2&&weak.length>1) out.push(weak.find(t=>!out.includes(t))||weak[0]);
  if(!out.length) out.push(T[T.length-1]);
  return [...new Set(out)].slice(0,2);
}
function difficulty(t){ const s=tp(t.id).s; return s<0.4?'лёгкая: выбор ответа и подстановка окончаний':(s<0.7?'средняя: подстановка и короткий перевод':'высокая: перевод целых предложений и поиск ошибок'); }
function typesFor(t){ const s=tp(t.id).s; return s<0.4?'mc, fill':(s<0.7?'mc, fill, translate':'fill, translate, fix'); }
function knownWords(n){ const ids=Object.keys(state.vocab).filter(i=>state.vocab[i].b>=2).map(Number); const base=ids.length?ids:VOCAB.map((_,i)=>i); const pick=[]; const arr=[...base]; while(pick.length<n&&arr.length){ pick.push(arr.splice(Math.floor(Math.random()*arr.length),1)[0]); } return pick.map(i=>VOCAB[i][0]).join(', '); }

async function explainTopic(t){
  const box=document.getElementById('explain-box'); const btn=document.getElementById('explain');
  if(!aiReady){ box.textContent='Ключ Anthropic API не добавлен в секреты Supabase.'; return; }
  if(explainCtl) explainCtl.abort(); explainCtl=new AbortController(); btn.disabled=true; box.textContent='Думаю…';
  const prompt=`Ты преподаватель корейского для русскоязычного взрослого ученика уровня ${t.lv}. Объясни очень просто и понятно грамматику «${t.t}» (${t.n}). Структура: 1) смысл в одном предложении; 2) как образуется, по шагам; 3) четыре новых примера с переводом на русский (не используй эти: ${t.e.map(e=>e[0]).join(' / ')}); 4) типичная ошибка русскоязычных и как её избежать. Пиши по-русски, корейские примеры на хангыле. До 180 слов, без markdown-заголовков.`;
  try{ await sampleFn(prompt,{modelTier:'quick',signal:explainCtl.signal,onText:({text})=>{ box.textContent=text; }}); }
  catch(e){ if(e.code==='cancelled') return; box.textContent=(e.text||'')+'\n'+aiError(e); }
  finally{ btn.disabled=false; }
}
function aiError(e){ const c=e&&e.code; const m={no_api_key:'Ключ Anthropic API не добавлен в секреты Supabase (переменная ANTHROPIC_API_KEY).',bad_api_key:'Ключ Anthropic API отклонён: проверьте его в секретах Supabase.',rate_limited:'Слишком много запросов, подождите минуту.',invalid_json:'ИИ ответил не по формату, попробуйте ещё раз.',refusal:'Модель отказалась отвечать на этот запрос.',api_error:'Ошибка Anthropic API'+(e.detail?': '+e.detail:'')+'.',unauthorized:'Сессия истекла, войдите снова.',bad_response:'Сервер вернул неожиданный ответ.'}; return m[c]||('Ошибка ИИ: '+(c||'неизвестная')+'.'); }

/* ============ ТРЕНИРОВКА ============ */
let session=null; // {topics, items, idx, results, loading, error}
function startSession(topics){ session={topics,items:[],idx:0,results:[],loading:true,error:null}; show('train'); generate(); }
async function generate(){
  if(!aiReady){ session.loading=false; session.error='noai'; renderTrain(); return; }
  const per=Math.ceil(6/session.topics.length);
  try{
    const batches=await Promise.all(session.topics.map(t=>sampleFn.json(buildPrompt(t,per),{modelTier:'quick',cache:false}).then(arr=>(Array.isArray(arr)?arr:[]).map(x=>({...x,topic:t.id})))));
    let items=[]; const max=Math.max(...batches.map(b=>b.length)); for(let i=0;i<max;i++) batches.forEach(b=>{ if(b[i]) items.push(b[i]); });
    items=items.filter(x=>x&&x.q&&x.a&&['mc','fill','translate','fix'].includes(x.type)).slice(0,6);
    if(!items.length) throw {code:'invalid_json'};
    session.items=items; session.loading=false;
  }catch(e){ session.loading=false; session.error=aiError(e); }
  renderTrain();
}
function buildPrompt(t,n){
  return `Ты преподаватель корейского для русскоязычного ученика (уровень ${t.lv}). Составь ${n} упражнений по теме «${t.t}» (${t.n}).
Правило: ${t.f}
Примеры из урока: ${t.e.map(e=>e[0]+' — '+e[1]).join('; ')}
Знакомые ученику слова, используй в основном их: ${knownWords(28)}.
Сложность: ${difficulty(t)}. Разрешённые типы: ${typesFor(t)}. Чередуй типы.
Ответь только JSON-массивом объектов вида {"type":"mc"|"fill"|"translate"|"fix","q":"...","options":["...","...","...","..."],"a":"...","alt":["..."],"why":"..."}.
Правила: mc — "q" это корейское предложение с пропуском ___ и переводом в скобках по-русски, 4 варианта в "options", "a" в точности равно одному из них; fill — "q" корейское предложение с ___ и русским переводом в скобках, "a" пропущенное слово или окончание; translate — "q" русское предложение, "a" его перевод на корейский; fix — "q" корейское предложение с одной ошибкой именно по этой теме, "a" исправленное предложение. "alt" — другие допустимые верные ответы (может быть пустым). "why" — одно короткое объяснение по-русски, почему так. Вежливый стиль 해요체. Никакого текста вне JSON.`;
}
function renderTrain(){
  const v=document.getElementById('view-train');
  if(!session){ v.innerHTML=`<div class="card"><div class="eyebrow">Тренировка</div><h2 style="font-size:19px;margin-top:6px">Упражнения подбираются под ваш прогресс</h2><p class="muted" style="margin:6px 0 14px">Слабые темы возвращаются чаще, новые добавляются по одной. Проверка и подсказки на русском.</p><div class="row"><button class="btn primary" id="go">Начать</button><button class="btn" id="go-weak">Только повторение</button></div>${aiReady?'':'<p class="notice" style="margin-top:14px">Ключ Anthropic API ещё не добавлен в секреты Supabase, поэтому упражнения пока не сгенерируются. Прогресс и словарь работают.</p>'}</div>`; document.getElementById('go').onclick=()=>startSession(pickTrainingTopics()); document.getElementById('go-weak').onclick=()=>{ const w=weakTopics(2); startSession(w.length?w:pickTrainingTopics()); }; return; }
  if(session.loading){ v.innerHTML=`<div class="card"><div class="eyebrow">Темы: ${session.topics.map(t=>'<span class="ko">'+esc(t.t)+'</span>').join(' · ')}</div><div class="loader" style="margin-top:14px"><i></i><span>Составляю упражнения под ваш уровень…</span></div></div>`; return; }
  if(session.error){ v.innerHTML=`<div class="card"><div class="eyebrow">Тренировка</div><p class="notice" style="margin-top:10px">${session.error==='noai'?'Ключ Anthropic API не добавлен в секреты Supabase (ANTHROPIC_API_KEY), поэтому упражнения не генерируются.':esc(session.error)}</p><div class="row" style="margin-top:14px"><button class="btn primary" id="retry">Попробовать снова</button><button class="btn" id="cancel">Назад</button></div></div>`; document.getElementById('retry').onclick=async()=>{ await boot(); startSession(session.topics); }; document.getElementById('cancel').onclick=()=>{ session=null; show('home'); }; return; }
  if(session.idx>=session.items.length){ renderSummary(); return; }
  const it=session.items[session.idx], t=byId[it.topic]||session.topics[0];
  const typeName={mc:'Выбор ответа',fill:'Подстановка',translate:'Перевод на корейский',fix:'Исправьте ошибку'}[it.type];
  v.innerHTML=`<div class="card">
    <div class="ex-head"><div class="row"><span class="chip acc">${esc(typeName)}</span><span class="muted small ko">${esc(t.t)}</span></div><div class="progress-dots">${session.items.map((_,i)=>`<i class="${i<session.idx?(session.results[i]?'ok':'bad'):(i===session.idx?'cur':'')}"></i>`).join('')}</div></div>
    <div class="ex-q ${it.type==='translate'?'':'ko'}">${esc(it.q)}</div>
    ${it.type==='mc'?`<div class="options">${(it.options||[]).map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`:`<form class="answer" id="ans"><input id="inp" autocomplete="off" lang="ko" placeholder="${it.type==='translate'?'Напишите по-корейски':'Ваш ответ'}" aria-label="Ответ"><button class="btn primary" type="submit">Проверить</button></form>`}
    <div id="fb"></div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn ghost" id="skip">Не знаю, показать ответ</button><button class="btn ghost" id="quit">Завершить</button></div>
  </div>`;
  document.querySelectorAll('#view-train .opt').forEach(b=>b.onclick=()=>checkAnswer(it.options[+b.dataset.i]));
  const f=document.getElementById('ans'); if(f){ f.onsubmit=e=>{ e.preventDefault(); const val=document.getElementById('inp').value.trim(); if(val) checkAnswer(val); }; document.getElementById('inp').focus(); }
  document.getElementById('skip').onclick=()=>finishItem(false,'Правильный ответ показан. Тема останется в повторении.',it);
  document.getElementById('quit').onclick=()=>{ session.items=session.items.slice(0,session.idx); renderTrain(); };
}
async function checkAnswer(val){
  const it=session.items[session.idx];
  const accepted=[it.a,...(Array.isArray(it.alt)?it.alt:[])].map(norm);
  let ok=accepted.includes(norm(val));
  if(!ok&&(it.type==='translate'||it.type==='fix')&&sampleFn){
    const fb=document.getElementById('fb'); fb.innerHTML='<div class="fb neutral"><div class="loader"><i></i><span>Проверяю ответ…</span></div></div>';
    lockInputs();
    try{
      const r=await sampleFn.json(`Проверь ответ ученика по корейскому. Тема: ${byId[it.topic]?.t||''} (${byId[it.topic]?.f||''}). Задание: ${it.q}. Эталонный ответ: ${it.a}. Ответ ученика: ${val}. Считай ответ верным, если грамматика по теме и смысл правильные, даже если выбраны другие слова или опущены частицы, допустимые в разговорной речи. Ответь только JSON {"ok":true|false,"fb":"короткое объяснение по-русски, 1-2 предложения, что именно верно или неверно"}.`,{modelTier:'quick'});
      ok=!!(r&&r.ok); finishItem(ok,r&&r.fb?String(r.fb):'',it,val); return;
    }catch(e){ finishItem(false,'Не удалось проверить через ИИ ('+aiError(e)+'). Сравните с эталоном.',it,val); return; }
  }
  finishItem(ok,'',it,val);
}
function lockInputs(){ document.querySelectorAll('#view-train .opt, #view-train #ans button, #view-train #inp, #skip').forEach(x=>x.disabled=true); }
function finishItem(ok,note,it,val){
  lockInputs();
  document.querySelectorAll('#view-train .opt').forEach(b=>{ const txt=it.options[+b.dataset.i]; if(norm(txt)===norm(it.a)) b.classList.add('right'); else if(val!==undefined&&norm(txt)===norm(val)&&!ok) b.classList.add('wrong'); });
  session.results[session.idx]=ok; updateTopic(it.topic,ok); api('attempt',{attempt:{topic:it.topic,type:it.type,q:it.q,a:it.a,user:val,correct:ok}}).catch(()=>{});
  if(!ok){ state.errors.push({id:it.topic,q:it.q,a:it.a,ts:Date.now()}); state.errors=state.errors.slice(-40); save(); }
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Верно':'Не совсем'}</b>${ok?'':` · правильно: <span class="ko">${esc(it.a)}</span>`}${note?`<span class="why">${esc(note)}</span>`:''}${it.why?`<span class="why">${esc(it.why)}</span>`:''}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="next">${session.idx+1<session.items.length?'Дальше':'Итоги'}</button></div>`;
  const nb=document.getElementById('next'); nb.focus(); nb.onclick=()=>{ session.idx++; renderTrain(); };
  document.querySelectorAll('#view-train .progress-dots i')[session.idx].className=ok?'ok':'bad';
}
function renderSummary(){
  const n=session.results.length, c=session.results.filter(Boolean).length;
  document.getElementById('view-train').innerHTML=`<div class="card">
    <div class="eyebrow">Итоги тренировки</div>
    <h2 style="font-size:24px;margin-top:6px">${c} из ${n} верно</h2>
    <div style="display:grid;gap:10px;margin-top:14px">${session.topics.map(t=>{ const p=tp(t.id); const [lab,cls]=status(t); return `<div class="row"><span class="ko grow" style="font-weight:500">${esc(t.t)}</span><span class="chip ${cls}">${lab}</span><span class="bar" style="width:90px"><i style="width:${Math.round(p.s*100)}%"></i></span></div>`; }).join('')}</div>
    <div class="row" style="margin-top:18px"><button class="btn primary" id="again">Новая тренировка</button><button class="btn" id="same">Ещё раз эти темы</button><button class="btn ghost" id="home">На главную</button></div>
  </div>`;
  document.getElementById('again').onclick=()=>startSession(pickTrainingTopics());
  document.getElementById('same').onclick=()=>startSession(session.topics);
  document.getElementById('home').onclick=()=>{ session=null; show('home'); };
}

let flip=false, listMode=false, exampleCtl=null;
const INTERVALS=[10*60e3, 1*864e5, 3*864e5, 7*864e5, 14*864e5, 30*864e5];
function dueWords(){ const now=Date.now(); return VOCAB.map((_,i)=>i).filter(i=>{ const v=state.vocab[i]; return !v||(v.d||0)<=now; }); }
function renderVocab(){

  const header=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Словарь</div><p class="muted small" style="margin:4px 0 0">${VOCAB.length} слов из конспекта и уроков · к повторению сейчас: <b>${due.length}</b></p></div><button class="btn" id="mode">${listMode?'Карточки':'Весь список'}</button></div>`;
  if(listMode){ v.innerHTML=header+`<div class="vocab-list">${VOCAB.map(([k,r],i)=>{ const b=state.vocab[i]?.b||0; return `<div><span class="ko">${esc(k)}</span><span class="muted" style="text-align:right">${esc(r)}<span class="box-dots">${[1,2,3,4,5].map(x=>`<i class="${b>=x?'on':''}"></i>`).join('')}</span></span></div>`; }).join('')}</div>`; document.getElementById('mode').onclick=()=>{ listMode=false; renderVocab(); }; return; }
  if(!due.length){ v.innerHTML=header+`<div class="card"><h2 style="font-size:19px">На сегодня всё повторено</h2><p class="muted" style="margin:6px 0 0">Следующие карточки появятся по расписанию интервального повторения.</p></div>`; document.getElementById('mode').onclick=()=>{ listMode=true; renderVocab(); }; return; }
  const i=due[0], [k,r]=VOCAB[i];
  v.innerHTML=header+`
  <button class="flash" id="flash"><span class="w">${esc(k)}</span>${flip?`<span class="m">${esc(r)}</span>`:`<span class="hint">нажмите, чтобы увидеть перевод</span>`}</button>
  <div class="row" style="justify-content:center">${flip?`<button class="btn" id="no" style="border-color:var(--bad);color:var(--bad)">Не помню</button><button class="btn primary" id="yes">Помню</button>`:`<button class="btn" id="reveal">Показать перевод</button>`}<button class="btn ghost" id="example" ${aiReady?'':'disabled'}>Пример с этим словом</button></div>
  <div class="ai-box" id="example-box"></div>`;
  document.getElementById('mode').onclick=()=>{ listMode=true; renderVocab(); };
  const doFlip=()=>{ flip=true; renderVocab(); };

  const grade=ok=>{ const cur=state.vocab[i]||{b:0,d:0}; const b=ok?Math.min(5,cur.b+1):0; state.vocab[i]={b,d:Date.now()+INTERVALS[b]}; state.days[today()]=(state.days[today()]||0)+0; save(); flip=false; renderVocab(); };
  const y=document.getElementById('yes'), nn=document.getElementById('no'); if(y) y.onclick=()=>grade(true); if(nn) nn.onclick=()=>grade(false);
  document.getElementById('example').onclick=async()=>{ const box=document.getElementById('example-box'); if(!aiReady) return; if(exampleCtl) exampleCtl.abort(); exampleCtl=new AbortController(); box.textContent='…'; try{ await sampleFn(`Дай два коротких простых предложения на корейском (уровень A1–A2, стиль 해요체) со словом «${k}» (${r}), каждое с переводом на русский. Только предложения и переводы, без пояснений.`,{modelTier:'quick',signal:exampleCtl.signal,onText:({text})=>{ box.textContent=text; }}); }catch(e){ if(e.code!=='cancelled') box.textContent=aiError(e); } };
}

/* ============ СТАРТ ============ */
const hash=location.hash.replace('#',''); if(views.includes(hash)&&hash!=='lesson') current=hash;
boot();
</script>
