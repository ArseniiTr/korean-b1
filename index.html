/* ============ ВСПОМОГАТЕЛЬНОЕ ============ */
const byId=Object.fromEntries(T.map(t=>[t.id,t]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tp(id){ return state.topics[id]||{s:0,n:0,c:0,t:0}; }
function status(t){ const p=tp(t.id); if(p.s>=0.8&&p.n>0) return ['Освоена','ok']; if(p.s>=0.8) return ['Знакома','ok']; if(p.n>0||t.k){ return p.s<0.5?['Повторить','warn']:['Учу','acc']; } return ['Новая','']; }
function mastered(){ return T.filter(t=>tp(t.id).s>=0.8).length; }
function nextNew(){ return T.find(t=>!t.k&&tp(t.id).n===0); }
function weakTopics(n){ return T.filter(t=>(tp(t.id).n>0||t.k)&&tp(t.id).s<0.8).sort((a,b)=>tp(a.id).s-tp(b.id).s||tp(a.id).t-tp(b.id).t).slice(0,n); }
function streak(){ let d=new Date(), n=0; const k=x=>x.toISOString().slice(0,10); if(!state.days[k(d)]) d.setDate(d.getDate()-1); while(state.days[k(d)]){ n++; d.setDate(d.getDate()-1); } return n; }
function updateTopic(id,ok){ const p=tp(id); p.n++; if(ok) p.c++; p.s=Math.max(0,Math.min(1, ok? p.s+(1-p.s)*0.25 : p.s-p.s*0.3)); p.t=Date.now(); state.topics[id]=p; state.days[today()]=(state.days[today()]||0)+1; }
// NFC: хангыль, набранный через IME или вставленный с macOS, может прийти разложенным на чамо
function norm(s){ return String(s||'').normalize('NFC').toLowerCase().replace(/[\s.,!?~…·'"“”‘’()\[\]-]/g,''); }
function pickTrainingTopics(){
  const weak=weakTopics(3); const nn=nextNew(); const out=[];
  if(weak.length&&tp(weak[0].id).s<0.5) out.push(weak[0]);
  if(nn) out.push(nn); else if(weak[1]) out.push(weak[1]);
  if(!out.length&&weak.length) out.push(weak[0]);
  if(out.length<2&&weak.length>1) out.push(weak.find(t=>!out.includes(t))||weak[0]);
  if(!out.length) out.push(T[T.length-1]);
  return [...new Set(out)].slice(0,2);
}
// слова из конспекта занятий считаются знакомыми, пока карточка или быстрая проверка не показала обратное
function wordKnown(i){ const v=state.vocab[i]; if(!v) return i<VOCAB_NOTES.length; return v.k===true||(v.b||0)>=3; }
function knownWords(n){ const {tier}=genParams(); const allowed=VOCAB.map((w,i)=>i).filter(i=>WORD_TIER[VOCAB[i][2]]<=tier); const known=allowed.filter(i=>wordKnown(i)||(state.vocab[i]&&state.vocab[i].b>=2)); const base=known.length>=12?known:allowed; const pick=[]; const arr=[...base]; while(pick.length<n&&arr.length){ pick.push(arr.splice(Math.floor(Math.random()*arr.length),1)[0]); } return pick.map(i=>VOCAB[i][0]).join(', '); }

/* ============ УРОВЕНЬ ПО ШКАЛЕ 한국어학당 (Институт корейского языка Ёнсе) ============
   Шесть уровней 1급–6급; цель учебника — 3급 (TOPIK 3, CEFR B1): «общение, достаточное для повседневной жизни в Корее».
   Оценка непрерывная, в «급»: 0..3+. Складывается из объективной части (грамматика уровня, покрытие ядра словаря,
   точность последних ответов), калибровочного теста (аналог 반편성시험: 어휘·문법·읽기·쓰기; 말하기 без звука не оцениваем)
   и субъективной поправки «Мне сложно / Мне легко», которая меняет только сложность заданий, а не сам уровень. */
const KLI=[
 {g:1,cefr:'A1',name:'1급',ru:'начальный I',lv:['A1','A1+'],words:735,goal:'хангыль, базовые фразы: знакомство, еда, покупки, дорога'},
 {g:2,cefr:'A2',name:'2급',ru:'начальный II',lv:['A2','A2+'],words:1100,goal:'сложные и вложенные предложения, вежливая и разговорная речь, бытовые проблемы'},
 {g:3,cefr:'B1',name:'3급',ru:'средний',lv:['B1','B1+'],words:1655,goal:'общение, достаточное для повседневной жизни; своё мнение, рассказы, тексты о корейском обществе'}
];
const TARGET_COVER=0.8; // 80 % ядра словаря уровня = словарь уровня освоен
// грамматика уровня: среднее освоение тем (0,8 = полностью), чтобы знакомые по конспекту темы (0,6) давали частичный зачёт
function tierGrammar(g){ const ts=T.filter(t=>KLI[g-1].lv.includes(t.lv)); return ts.length?ts.reduce((a,t)=>a+Math.min(1,tp(t.id).s/0.8),0)/ts.length:0; }
function tierWords(g){ return VOCAB.map((w,i)=>i).filter(i=>WORD_TIER[VOCAB[i][2]]===g); }
function tierVocab(g){ const ws=tierWords(g); return ws.length?ws.filter(wordKnown).length/ws.length:0; }
function tierScore(g){ return 0.5*tierGrammar(g)+0.5*Math.min(1,tierVocab(g)/TARGET_COVER); }
function recentAcc(k){ const a=state.recent[k]||[]; return a.length>=4?a.filter(Boolean).length/a.length:null; }
function pushRecent(k,ok){ const a=state.recent[k]=(state.recent[k]||[]); a.push(!!ok); if(a.length>20) a.shift(); }
function objectiveLevel(){ let lvl=0; for(const k of KLI){ const s=tierScore(k.g); if(s>=0.7) lvl=k.g; else { lvl=(k.g-1)+Math.min(0.99,s/0.7); break; } } return lvl; }
function assess(){
  let base=objectiveLevel();
  const accs=['g','r','w'].map(recentAcc).filter(x=>x!==null); const acc=accs.length?accs.reduce((a,b)=>a+b,0)/accs.length:null;
  if(acc!==null){ if(acc>0.85) base+=0.2; else if(acc<0.55) base-=0.3; }
  const L=state.level; if(L.cal!==null&&L.cal!==undefined){ const w=Math.max(0,0.6-(L.calN||0)/120); base=w*L.cal+(1-w)*base; }
  return Math.max(0,Math.min(3.5,base));
}
function levelLabel(x){ if(x>=3) return '3급 · B1 достигнут'; const g=Math.floor(x)+1; const f=x-Math.floor(x); return `${g}급 ${f<0.33?'초반':(f<0.66?'중반':'후반')} · ${KLI[g-1].cefr}`; }
function genParams(){ const L=Math.max(0,Math.min(3.5,assess()+state.level.offset)); const tier=L<1?1:(L<2?2:3); const maxWords=Math.round(6+L*3); const readSent=L<1?3:(L<2?4:5); return {L,tier,maxWords,readSent,label:levelLabel(L)}; }
function adjustOffset(d,why){ const L=state.level; L.offset=Math.max(-1,Math.min(1,+(L.offset+d).toFixed(2))); L.hist.push({ts:Date.now(),d,why}); L.hist=L.hist.slice(-50); save(); }
function vocabRating(){ const total=VOCAB.length, known=VOCAB.filter((_,i)=>wordKnown(i)).length; return {total,known,tiers:KLI.map(k=>({g:k.g,n:tierWords(k.g).length,known:tierWords(k.g).filter(wordKnown).length,words:k.words}))}; }

const TYPES=['mc','fill','fix','order','translate','read','write','dialog'];
const SKILL_OF={mc:'g',fill:'g',fix:'g',order:'g',read:'r',translate:'w',write:'w',dialog:'w'};
const SKILLS={g:{nm:'Грамматика',ko:'문법',cls:'acc',bar:'blue'},r:{nm:'Чтение',ko:'읽기',cls:'teal',bar:'teal'},w:{nm:'Письмо',ko:'쓰기',cls:'pink',bar:'pink'}};
const TYPE_NAME={mc:'Выбор ответа',fill:'Подстановка',fix:'Исправьте ошибку',order:'Соберите предложение',translate:'Перевод на корейский',read:'Чтение',write:'Письмо',dialog:'Диалог'};
function skillRate(k){ const s=state.skills[k]; return s.n?s.c/s.n:0; }
function skillLabel(k){ const s=state.skills[k]; if(s.n<5) return 'мало данных'; const r=s.c/s.n; return r<0.5?'шатко':(r<0.75?'уверенно':'отлично'); }
function weakestSkill(){ const score=k=>state.skills[k].n<4?-1:skillRate(k); return ['g','r','w'].sort((a,b)=>score(a)-score(b))[0]; }
function pickScene(){ return [...SCENES].sort((a,b)=>(state.scenes[a.id]||0)-(state.scenes[b.id]||0)||hashStr(a.id+today())-hashStr(b.id+today()))[0]; }
function grammarTypes(t){ const s=tp(t.id).s; return s<0.4?['mc','fill']:(s<0.7?['mc','fill','order']:['fill','fix','order']); }
function writingTypes(t){ const s=tp(t.id).s, L=genParams().L; return (s<0.5||L<0.7)?['translate']:['translate','write','dialog']; }
function planTypes(topics){
  const base=topics.length>1?[['g','r','g','w'],['g','w','g']]:[['g','r','g','w','g','w']];
  const weak=weakestSkill();
  if(weak==='r'){ const last=base[base.length-1]; last[last.indexOf('g')]='r'; }
  if(weak==='w'){ base[0][base[0].indexOf('g')]='w'; }
  return base.map((arr,i)=>{ const t=topics[i]; const g=grammarTypes(t), w=writingTypes(t); let gi=hashStr(t.id)%g.length, wi=0;
    return arr.map(k=>k==='g'?g[(gi++)%g.length]:(k==='w'?w[(wi++)%w.length]:'read')); });
}

async function aiText(prompt,boxId,btnIds,maxTokens,kind){
  const box=document.getElementById(boxId); const btns=btnIds.map(id=>document.getElementById(id)).filter(Boolean);

  finally{ btns.forEach(b=>b.disabled=false); }

function gloss(text,boxId,btnId){ return aiText(`Дай дословный перевод по словам, строго в корейском порядке слов, чтобы русскоязычный ученик понял структуру. Формат: каждая строка «корейское слово = перевод корня + частица/окончание в скобках». Пример: «저는 = я + 는 (тема)», «학교에 = школа + 에 (куда/где)», «가요 = идти + 아/어요 (вежл. наст.)». После каждого предложения строка «→ литературный перевод». Текст:\n${text}`,boxId,[btnId],Math.min(700,120+text.length*3),'gloss'); }
function aiError(e){ const c=e&&e.code; const m={no_api_key:'Ключ Anthropic API не добавлен. Введите его на главной.',bad_api_key:'Ключ Anthropic API отклонён: введите другой на главной.',rate_limited:'Слишком много запросов, подождите минуту.',invalid_json:'ИИ ответил не по формату, попробуйте ещё раз.',refusal:'Модель отказалась отвечать на этот запрос.',api_error:'Ошибка Anthropic API'+(e.detail?': '+e.detail:'')+'.',unauthorized:'Сессия истекла, войдите снова.',bad_response:'Сервер вернул неожиданный ответ.'}; return m[c]||('Ошибка ИИ: '+(c||'неизвестная')+'.'); }

function startSession(topics){ const scene=pickScene(); state.scenes[scene.id]=Date.now(); state.level.offset=+(state.level.offset*0.8).toFixed(2); if(Math.abs(state.level.offset)<0.05) state.level.offset=0; save(); session={mode:'train',topics,scene,items:[],idx:0,results:[],loading:true,error:null}; show('train'); generate(); }
function validItem(x){
  if(!x||!TYPES.includes(x.type)||!x.a) return false;
  if(['mc','read'].includes(x.type)&&!(Array.isArray(x.options)&&x.options.length>=2)) return false;
  if(['mc','fill'].includes(x.type)&&!x.cal&&!x.ach&&!String(x.q||'').includes('___')) return false; // подстановка без пропуска бесполезна
  if(['read','dialog'].includes(x.type)&&!x.text) return false;
  if(!x.q&&x.type!=='dialog') return false;
  if(x.type==='order'&&String(x.a).trim().split(/\s+/).length<3) x.type='translate';
  return true;
}
// Экономия и надёжность: по 2–3 задания на запрос, обрезанный JSON спасаем по целым объектам
function chunk(arr,n){ const o=[]; for(let i=0;i<arr.length;i+=n) o.push(arr.slice(i,i+n)); return o; }
function salvage(text){ const out=[]; const t=String(text||''); let i=t.indexOf('{'); while(i>=0&&i<t.length){ let depth=0,inStr=false,escp=false,j=i; for(;j<t.length;j++){ const c=t[j]; if(inStr){ if(escp) escp=false; else if(c==='\\') escp=true; else if(c==='"') inStr=false; continue; } if(c==='"') inStr=true; else if(c==='{') depth++; else if(c==='}'){ depth--; if(depth===0){ try{ out.push(JSON.parse(t.slice(i,j+1))); }catch(x){} break; } } } if(j>=t.length) break; i=t.indexOf('{',j+1); } return out; }
async function genChunk(prompt){
  try{ const arr=await sampleFn.json(prompt,{kind:'exercises',max_tokens:900}); return Array.isArray(arr)?arr:salvage(JSON.stringify(arr)); }
  catch(e){ if(e.code==='invalid_json'&&e.text){ const s=salvage(e.text); if(s.length) return s; } throw e; }
}
async function generate(){
  if(!aiReady){ session.loading=false; session.error='noai'; renderTrain(); return; }
  const plan=planTypes(session.topics);
  const jobs=[]; session.topics.forEach((t,i)=>chunk(plan[i],3).forEach(c=>jobs.push({t,types:c})));
  try{
    const res=await Promise.all(jobs.map(j=>genChunk(buildPrompt(j.t,j.types,session.scene)).then(arr=>arr.filter(validItem).map(x=>({...x,topic:j.t.id})))));
    const batches=session.topics.map(t=>res.filter((_,k)=>jobs[k].t===t).flat());
    let items=[]; const max=Math.max(...batches.map(b=>b.length)); for(let i=0;i<max;i++) batches.forEach(b=>{ if(b[i]) items.push(b[i]); });
    if(!items.length) throw {code:'invalid_json'};
    session.items=items.slice(0,8); session.loading=false;
  }catch(e){ session.loading=false; session.error=aiError(e); }
  renderTrain();
}

// Ввод хангыля: IME собирает слог из чамо; Enter во время сборки не должен отправлять ответ
function wireInput(el,onSubmit){
  let composing=false;
  el.addEventListener('compositionstart',()=>{ composing=true; });
  el.addEventListener('compositionend',()=>{ composing=false; });
  el.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    if(e.isComposing||e.keyCode===229||composing) return;
    if(el.tagName==='TEXTAREA'&&!(e.metaKey||e.ctrlKey)) return;
    e.preventDefault(); setTimeout(()=>onSubmit(el.value.trim()),0);
  });
}

    ${fix&&norm(fix)!==norm(val)?`<p class="quote">Ваш вариант с правкой: <span class="ko">${esc(fix)}</span></p>`:''}
    ${note?`<p class="why">${esc(note)}</p>`:''}${it.why&&!mistake?`<p class="why">${esc(it.why)}</p>`:''}</div></div>
    <div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn primary" id="next">${session.idx+1<session.items.length?'Дальше':'Итоги'}</button>${session.mode!=='train'?'':`<span class="row" style="gap:6px"><button class="btn small" id="hard">Мне сложно</button><button class="btn small" id="easy">Мне легко</button></span>`}</div>`;
  const nb=document.getElementById('next'); nb.focus(); nb.onclick=()=>{ session.idx++; renderTrain(); };
  const ga=document.getElementById('gloss-a'); if(ga) ga.onclick=()=>gloss(it.a,'gloss-a-box','gloss-a');
  const hard=document.getElementById('hard'), easy=document.getElementById('easy');
  if(hard) hard.onclick=()=>{ adjustOffset(-0.25,'hard'); toast('Понял: следующие задания будут проще (поправка '+state.level.offset.toFixed(2)+')'); hard.disabled=easy.disabled=true; };
  if(easy) easy.onclick=()=>{ adjustOffset(0.25,'easy'); toast('Понял: следующие задания будут сложнее (поправка +'+state.level.offset.toFixed(2)+')'); hard.disabled=easy.disabled=true; };
  const dots=document.querySelectorAll('#view-train .progress-dots i'); if(dots[session.idx]) dots[session.idx].className=ok?'ok':'bad';
}
function renderSummary(){
  const n=session.results.length, c=session.results.filter(Boolean).length;
  const bySkill={}; session.items.slice(0,n).forEach((it,i)=>{ const k=SKILL_OF[it.type]; bySkill[k]=bySkill[k]||{n:0,c:0}; bySkill[k].n++; if(session.results[i]) bySkill[k].c++; });
  let auto=''; if(n>=4){ const acc=c/n; if(acc<0.4){ adjustOffset(-0.25,'auto-low'); auto='Точность ниже 40 %: следующая тренировка будет проще.'; } else if(acc>0.9){ adjustOffset(0.25,'auto-high'); auto='Точность выше 90 %: следующая тренировка будет сложнее.'; } }
  document.getElementById('view-train').innerHTML=`<div class="panel">
    ${sceneArt(session.scene)}
    <div class="eyebrow">Итоги тренировки</div>
    <h2 style="font-size:30px;margin-top:6px">${c} из ${n} верно</h2>
    <div class="row" style="margin-top:10px">${Object.keys(bySkill).map(k=>`<span class="chip ${SKILLS[k].cls}">${SKILLS[k].nm} ${bySkill[k].c}/${bySkill[k].n}</span>`).join('')}<span class="chip purple">${esc(genParams().label)}</span></div>
    ${auto?`<p class="notice" style="margin-top:12px">${auto}</p>`:''}
    <div style="display:grid;gap:10px;margin-top:16px">${session.topics.map(t=>{ const p=tp(t.id); const [lab,cls]=status(t); return `<div class="row"><span class="ko grow" style="font-weight:700">${esc(t.t)}</span><span class="chip ${cls}">${lab}</span><span class="bar" style="width:90px"><i style="width:${Math.round(p.s*100)}%"></i></span></div>`; }).join('')}</div>
    <div class="row" style="margin-top:18px"><button class="btn primary" id="again">Новая тренировка</button><button class="btn" id="same">Ещё раз эти темы</button><button class="btn small" id="hard">Было сложно</button><button class="btn small" id="easy">Было легко</button><button class="btn ghost" id="home">На главную</button></div>
  </div>`;
  document.getElementById('again').onclick=()=>startSession(pickTrainingTopics());
  document.getElementById('same').onclick=()=>startSession(session.topics);
  document.getElementById('home').onclick=()=>{ session=null; show('home'); };
  document.getElementById('hard').onclick=e=>{ adjustOffset(-0.25,'hard'); toast('Следующая тренировка будет проще'); e.target.disabled=true; };
  document.getElementById('easy').onclick=e=>{ adjustOffset(0.25,'easy'); toast('Следующая тренировка будет сложнее'); e.target.disabled=true; };
}

/* ============ КАЛИБРОВКА (аналог 반편성시험 한국어학당) ============
   Части: 어휘 — по 4 слова каждого уровня (локально, без ИИ); 문법 — по 2 вопроса на уровень; 읽기 — текст 2급 с вопросом;
   쓰기 — короткое письменное задание, оценка 0–3 (задача выполнена / грамматика / лексика). 말하기 без звука не оцениваем. */
function vocabMc(i){ const [k,r,lv]=VOCAB[i]; const pool=VOCAB.map((w,j)=>j).filter(j=>j!==i&&VOCAB[j][2]===lv&&VOCAB[j][1]!==r); const d=shuffle([...pool]).slice(0,3).map(j=>VOCAB[j][1]); return {type:'mc',cal:true,part:'어휘 '+WORD_TIER[lv]+'급',tier:WORD_TIER[lv],q:`Что значит «${k}»?`,options:shuffle([r,...d]),a:r,why:'',vi:i,topic:null}; }
async function startCalib(){
  const scene=pickScene(); session={mode:'calib',topics:[],scene,items:[],idx:0,results:[],loading:true,error:null}; show('train');
  if(!aiReady){ session.loading=false; session.error='noai'; renderTrain(); return; }
  const vocabItems=[]; KLI.forEach(k=>{ const ws=shuffle(tierWords(k.g)).slice(0,4); ws.forEach(i=>vocabItems.push(vocabMc(i))); });
  const gramTopics=KLI.map(k=>{ const ts=T.filter(t=>k.lv.includes(t.lv)&&!t.k); const pick=ts.length?[ts[Math.floor(ts.length*0.3)],ts[Math.floor(ts.length*0.7)]]:[]; return {g:k.g,topics:pick.filter(Boolean)}; });
  const gramPrompt=(g,ts)=>`Преподаватель корейского составляет короткий тест уровня ${g}급 (${KLI[g-1].cefr}) для русскоязычного ученика. Сцена: ${scene.ko} — ${scene.d}. Составь ровно ${ts.length} заданий типа mc, по одному на каждую грамматику: ${ts.map(t=>`«${t.t}» (${t.f})`).join('; ')}. ${SPEC.mc}. Только JSON-массив объектов {"type":"mc","q","options","a","why"}; "why" до 10 слов по-русски. Проверь правильность ответов. Без текста вне JSON.`;
  const readPrompt=`Составь для русскоязычного ученика уровня 2급 (A2) одно задание read и одно write про сцену ${scene.ko} — ${scene.d}. ${SPEC.read.replace('грамматика темы встречается не меньше двух раз','4 предложения, бытовая ситуация')}. ${SPEC.write.replace('с этой грамматикой','(любая знакомая грамматика уровня A2)')}. Только JSON-массив из двух объектов {"type","q","text","options","a","why"}. Без текста вне JSON.`;
  try{
    const jobs=gramTopics.filter(x=>x.topics.length).map(x=>genChunk(gramPrompt(x.g,x.topics)).then(arr=>arr.filter(validItem).map((it,i)=>({...it,cal:true,part:'문법 '+x.g+'급',tier:x.g,topic:x.topics[i]?x.topics[i].id:null}))));
    jobs.push(genChunk(readPrompt).then(arr=>arr.filter(validItem).map(it=>({...it,cal:true,part:it.type==='read'?'읽기':'쓰기',tier:2,topic:null}))));
    const res=await Promise.all(jobs);
    const gram=res.slice(0,-1).flat(), rw=res[res.length-1];
    session.items=[...vocabItems,...gram,...rw.filter(x=>x.type==='read'),...rw.filter(x=>x.type==='write')];
    if(session.items.length<vocabItems.length+2) throw {code:'invalid_json'};
    session.loading=false;
  }catch(e){ session.loading=false; session.error=aiError(e); }
  renderTrain();
}
function renderCalibResult(){
  const items=session.items.slice(0,session.results.length);
  const part=(pred)=>{ const xs=items.filter(pred); return xs.length?xs.filter(x=>x.ok).length/xs.length:null; };
  const v=[1,2,3].map(g=>part(x=>x.part.startsWith('어휘')&&x.tier===g)), gr=[1,2,3].map(g=>part(x=>x.part.startsWith('문법')&&x.tier===g));
  const rd=part(x=>x.part==='읽기'), wr=part(x=>x.part==='쓰기');
  // уровень: высший 급, где словарь ≥ 75 % и грамматика ≥ 50 %, плюс доля следующего уровня; письмо и чтение дают ±0,25
  let lvl=0; for(let g=1;g<=3;g++){ const vv=v[g-1]??0, gg=gr[g-1]??0; if(vv>=0.75&&gg>=0.5) lvl=g; else { lvl=(g-1)+0.5*((vv+gg)/2); break; } }
  if(wr!==null) lvl+= wr>=0.99?0.25:(wr<0.01?-0.25:0); if(rd!==null&&rd<0.5) lvl-=0.15;
  lvl=Math.max(0,Math.min(3,+lvl.toFixed(2)));
  // перенос результатов в прогресс: слова и темы
  items.forEach(x=>{ if(x.vi!==undefined){ const cur=state.vocab[x.vi]||{b:0,d:0}; if(x.ok) state.vocab[x.vi]={...cur,k:true,b:Math.max(cur.b||0,3),d:Date.now()+7*864e5}; else state.vocab[x.vi]={...cur,k:false,b:0,d:Date.now()}; } if(x.topic&&x.ok){ const p=tp(x.topic); if(p.s<0.6){ p.s=0.6; state.topics[x.topic]=p; } } });
  state.level.cal=lvl; state.level.calAt=Date.now(); state.level.calN=0; state.level.offset=0;
  state.level.profile={v,gr,rd,wr,ts:Date.now()}; save();
  const pct=x=>x===null?'—':Math.round(x*100)+'%';
  document.getElementById('view-train').innerHTML=`<div class="panel">
    ${sceneArt(session.scene)}
    <div class="eyebrow">Результат калибровки · 반편성시험</div>
    <h2 style="font-size:28px;margin-top:6px">${esc(levelLabel(lvl))}</h2>
    <p class="muted" style="margin:6px 0 0">Оценка по шкале Института корейского языка Ёнсе (без части «говорение»). Теперь задания подстроены под этот уровень, а дальше его уточняет ваша реальная статистика ответов.</p>
    <div class="subs">${[1,2,3].map(g=>`<div class="sub"><b>${pct(v[g-1])} · ${pct(gr[g-1])}</b><span>${g}급: словарь · грамматика</span></div>`).join('')}<div class="sub"><b>${pct(rd)} · ${pct(wr)}</b><span>чтение · письмо</span></div></div>
    <div class="row" style="margin-top:18px"><button class="btn primary" id="again">Начать тренировку</button><button class="btn ghost" id="home">На главную</button></div>
  </div>`;
  document.getElementById('again').onclick=()=>startSession(pickTrainingTopics());
  document.getElementById('home').onclick=()=>{ session=null; show('home'); };
}

/* ============ СЛОВА ============ */
let flip=false, vocabMode='cards', vocabTier=0; // cards | list | quick
const INTERVALS=[10*60e3, 1*864e5, 3*864e5, 7*864e5, 14*864e5, 30*864e5];
function tierFilter(i){ return !vocabTier||WORD_TIER[VOCAB[i][2]]===vocabTier; }
function dueWords(){ const now=Date.now(); return VOCAB.map((_,i)=>i).filter(i=>tierFilter(i)&&!(state.vocab[i]&&state.vocab[i].k===true&&(state.vocab[i].d||0)>now)).filter(i=>{ const v=state.vocab[i]; return !v||(v.d||0)<=now; }); }
function renderVocab(){
  const v=document.getElementById('view-vocab'); const vr=vocabRating(); const due=dueWords();
  const header=`<div class="panel flat" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Словарь до B1</div><p class="muted small" style="margin:4px 0 0">Знакомо ${vr.known} из ${vr.total} · к повторению сейчас: <b>${due.length}</b></p></div>
    <div class="filters"><button class="btn small" data-mode="cards" aria-pressed="${vocabMode==='cards'}">Карточки</button><button class="btn small" data-mode="quick" aria-pressed="${vocabMode==='quick'}">Быстрая проверка</button><button class="btn small" data-mode="list" aria-pressed="${vocabMode==='list'}">Список</button></div></div>
    <div class="filters"><button class="btn small" data-tier="0" aria-pressed="${vocabTier===0}">Все уровни</button>${KLI.map(k=>`<button class="btn small" data-tier="${k.g}" aria-pressed="${vocabTier===k.g}">${k.name} · ${k.cefr} · ${vr.tiers[k.g-1].known}/${vr.tiers[k.g-1].n}</button>`).join('')}</div></div>`;
  let body='';
  if(vocabMode==='list'){ body=`<div class="vocab-list">${VOCAB.map(([k,r,lv],i)=>({k,r,lv,i})).filter(x=>tierFilter(x.i)).map(({k,r,lv,i})=>{ const b=state.vocab[i]?.b||0; const kn=wordKnown(i); return `<div><span><span class="ko">${esc(k)}</span> <span class="chip" style="font-size:9px;padding:1px 6px">${lv}</span></span><span class="muted" style="text-align:right;display:flex;align-items:center;gap:8px"><span>${esc(r)}<span class="box-dots">${[1,2,3,4,5].map(x=>`<i class="${b>=x?'on':''}"></i>`).join('')}</span></span><button class="mark ${kn?'on':''}" data-i="${i}" title="${kn?'Знакомо':'Отметить как знакомое'}">✓</button></span></div>`; }).join('')}</div>`; }
  else if(vocabMode==='quick'){ const pool=VOCAB.map((_,i)=>i).filter(i=>tierFilter(i)&&!(state.vocab[i]&&state.vocab[i].k!==undefined)); if(!pool.length) body=`<div class="panel"><h2 style="font-size:22px">Все слова этого уровня уже проверены</h2><p class="muted" style="margin:6px 0 0">Отметки можно изменить в списке.</p></div>`; else { const i=pool[hashStr(String(pool.length)+today())%pool.length]; const [k,r,lv]=VOCAB[i]; body=`<div class="panel quick"><span class="chip">${lv} · осталось ${pool.length}</span><span class="w">${esc(k)}</span><p class="muted" style="margin:0">Знаете перевод? Отвечайте честно — от этого зависит подбор заданий.</p><div class="row" style="justify-content:center"><button class="btn" id="q-no" style="color:var(--bad)">Не знаю</button><button class="btn teal" id="q-show">Показать</button><button class="btn primary" id="q-yes">Знаю</button></div><p id="q-ans" class="ko" style="margin:0;font-size:18px;min-height:1.5em"></p></div>`; setTimeout(()=>{ const yes=document.getElementById('q-yes'), no=document.getElementById('q-no'), sh=document.getElementById('q-show'); const mark=kn=>{ const cur=state.vocab[i]||{b:0,d:0}; state.vocab[i]=kn?{...cur,k:true,b:Math.max(cur.b||0,3),d:Date.now()+7*864e5}:{...cur,k:false,b:0,d:Date.now()}; save(); renderVocab(); }; if(yes) yes.onclick=()=>mark(true); if(no) no.onclick=()=>mark(false); if(sh) sh.onclick=()=>{ document.getElementById('q-ans').textContent=r; }; },0); } }
  else if(!due.length){ body=`<div class="panel"><h2 style="font-size:24px">На сегодня всё повторено</h2><p class="muted" style="margin:6px 0 0">Следующие карточки появятся по расписанию интервального повторения. Загляните в «Быструю проверку», чтобы отметить знакомые слова.</p></div>`; }
  else { const i=due[0], [k,r,lv]=VOCAB[i]; body=`
  <button class="flash" id="flash"><span class="chip lvl">${lv} · ${WORD_TIER[lv]}급</span><span class="w">${esc(k)}</span>${flip?`<span class="m">${esc(r)}</span>`:`<span class="hint">нажмите, чтобы увидеть перевод</span>`}</button>
  <div class="row" style="justify-content:center">${flip?`<button class="btn" id="no" style="color:var(--bad)">Не помню</button><button class="btn primary" id="yes">Помню</button>`:`<button class="btn teal" id="reveal">Показать перевод</button>`}<button class="btn ghost" id="example" ${aiReady?'':'disabled'}>Пример из жизни</button></div>
  <div class="ai-box" id="example-box"></div>`; }
  v.innerHTML=header+body;
  v.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ vocabMode=b.dataset.mode; flip=false; renderVocab(); });
  v.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{ vocabTier=+b.dataset.tier; flip=false; renderVocab(); });
  v.querySelectorAll('.mark').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; const cur=state.vocab[i]||{b:0,d:0}; const kn=wordKnown(i); state.vocab[i]=kn?{...cur,k:false,b:0,d:Date.now()}:{...cur,k:true,b:Math.max(cur.b||0,3),d:Date.now()+7*864e5}; save(); renderVocab(); });
  if(vocabMode==='cards'&&due.length){ const i=due[0], [k,r]=VOCAB[i];
    const doFlip=()=>{ flip=true; renderVocab(); };
    document.getElementById('flash').onclick=doFlip; const rv=document.getElementById('reveal'); if(rv) rv.onclick=doFlip;
    const grade=ok=>{ const cur=state.vocab[i]||{b:0,d:0}; const b=ok?Math.min(5,(cur.b||0)+1):0; state.vocab[i]={...cur,b,d:Date.now()+INTERVALS[b],k:b>=3?true:(cur.k===true?false:cur.k)}; save(); flip=false; renderVocab(); };
    const y=document.getElementById('yes'), nn=document.getElementById('no'); if(y) y.onclick=()=>grade(true); if(nn) nn.onclick=()=>grade(false);
    document.getElementById('example').onclick=()=>{ const sc=pickScene(); aiText(`Два коротких бытовых предложения на корейском (уровень ${genParams().tier}급, 해요체) со словом «${k}» (${r}) из жизни в Корее, сцена: ${sc.ko}. К каждому перевод на русский и в скобках дословный порядок слов. Только предложения и переводы.`,'example-box',['example'],260); }; }
}

/* ============ СТАРТ ============ */
const hash=location.hash.replace('#',''); if(views.includes(hash)&&hash!=='lesson') current=hash;
boot();
</script>
